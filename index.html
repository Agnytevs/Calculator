<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Калькулятор Pro MAX</title>
<style>
  /* ═══════════════ СВЕТЛАЯ ТЕМА (по умолчанию — тёмная) ═══════════════ */
  :root {
    --bg:#0e1116; --bg-elev:#161a21; --bg-elev-2:#1d222b; --bg-panel:#11151b;
    --border:#262c36; --text:#e8ecf2; --text-dim:#8b95a5; --text-mute:#5b6473;
    --accent:#5b9dff; --accent-2:#7c5cff;
    --success:#3ecf8e; --danger:#ff5b6e; --warning:#ffb454; --teal:#2dd4bf;
    --btn-num-bg:#232935; --btn-num-text:#ffffff;
    --btn-op-bg:#3a2f4d; --btn-op-text:#c9b8ff;
    --btn-fn-bg:#2a2f4a; --btn-fn-text:#a8b8ff;
    --btn-ctrl-bg:#1d222b; --btn-ctrl-text:#8b95a5;
    --radius:14px; --radius-sm:10px;
    --shadow:0 4px 20px rgba(0,0,0,0.35);
    --glow-1:rgba(91,157,255,0.10);
    --glow-2:rgba(124,92,255,0.10);
  }

  /* ═══════════════ АКЦЕНТНЫЕ ТЕМЫ ═══════════════ */
  html.accent-emerald { --accent:#3ecf8e; --accent-2:#22a06b; --glow-1:rgba(62,207,142,0.12); --glow-2:rgba(34,160,107,0.12); --btn-op-bg:#2a4a3d; --btn-op-text:#a8e8c8; --btn-fn-bg:#1f3d33; --btn-fn-text:#7be0b5; }
  html.accent-rose    { --accent:#ff5b6e; --accent-2:#d63a4d; --glow-1:rgba(255,91,110,0.12); --glow-2:rgba(214,58,77,0.12); --btn-op-bg:#4a2a2f; --btn-op-text:#ffb8c0; --btn-fn-bg:#3d1f24; --btn-fn-text:#ff96a5; }
  html.accent-amber   { --accent:#ffb454; --accent-2:#f39c12; --glow-1:rgba(255,180,84,0.12); --glow-2:rgba(243,156,18,0.12); --btn-op-bg:#4a3a1f; --btn-op-text:#ffe0a8; --btn-fn-bg:#3d2f1a; --btn-fn-text:#ffcb70; }
  html.accent-teal    { --accent:#2dd4bf; --accent-2:#189e8e; --glow-1:rgba(45,212,191,0.12); --glow-2:rgba(24,158,142,0.12); --btn-op-bg:#1f4a45; --btn-op-text:#a8ebe0; --btn-fn-bg:#1a3d39; --btn-fn-text:#7be0d3; }
  html.accent-violet  { --accent:#a78bfa; --accent-2:#7c5cff; --glow-1:rgba(167,139,250,0.12); --glow-2:rgba(124,92,255,0.12); --btn-op-bg:#3a2f52; --btn-op-text:#d8c8ff; --btn-fn-bg:#2f2644; --btn-fn-text:#c0a8ff; }
  html.accent-pink    { --accent:#f472b6; --accent-2:#db2777; --glow-1:rgba(244,114,182,0.12); --glow-2:rgba(219,39,119,0.12); --btn-op-bg:#4a1f35; --btn-op-text:#ffb8d8; --btn-fn-bg:#3d1a2c; --btn-fn-text:#ff96c0; }

  /* ═══════════════ СВЕТЛАЯ ТЕМА (перекрывает всё) ═══════════════ */
  html.light {
    --bg:#eef1f7; --bg-elev:#ffffff; --bg-elev-2:#e2e7ef; --bg-panel:#ffffff;
    --border:#d1d8e3; --text:#1a2028; --text-dim:#5b6473; --text-mute:#8b95a5;
    --btn-num-bg:#ffffff; --btn-num-text:#1a2028;
    --btn-op-bg:#dcd0f5; --btn-op-text:#5b3fa0;
    --btn-fn-bg:#d4defc; --btn-fn-text:#2a4d99;
    --btn-ctrl-bg:#e2e7ef; --btn-ctrl-text:#5b6473;
    --shadow:0 4px 20px rgba(20,30,60,0.08);
  }
  /* Светлая + акценты */
  html.light.accent-emerald { --btn-op-bg:#c8ead8; --btn-op-text:#166644; --btn-fn-bg:#d0f0e0; --btn-fn-text:#1a7550; --accent:#22a06b; --accent-2:#189e8e; }
  html.light.accent-rose    { --btn-op-bg:#f5d0d5; --btn-op-text:#8c1a26; --btn-fn-bg:#f8dce0; --btn-fn-text:#a01e2f; --accent:#d63a4d; --accent-2:#db2777; }
  html.light.accent-amber   { --btn-op-bg:#f5e0c0; --btn-op-text:#8a5a10; --btn-fn-bg:#f8e8d0; --btn-fn-text:#a06612; --accent:#f39c12; --accent-2:#e67e22; }
  html.light.accent-teal    { --btn-op-bg:#c0e8e0; --btn-op-text:#0d5a52; --btn-fn-bg:#cceee6; --btn-fn-text:#106660; --accent:#189e8e; --accent-2:#0d8a7a; }
  html.light.accent-violet  { --btn-op-bg:#ddd0f5; --btn-op-text:#5a3f9c; --btn-fn-bg:#e5daf8; --btn-fn-text:#6a4bb0; --accent:#7c5cff; --accent-2:#6a4ce0; }
  html.light.accent-pink    { --btn-op-bg:#f5d0e2; --btn-op-text:#9c1a5e; --btn-fn-bg:#f8dce8; --btn-fn-text:#b02070; --accent:#db2777; --accent-2:#c026a0; }

  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',system-ui,sans-serif;
    background:var(--bg); color:var(--text);
    user-select:none; -webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
    transition:background 0.4s, color 0.4s;
    overscroll-behavior:none;
  }
  body::before, body::after {
    content:''; position:fixed; inset:-20%;
    pointer-events:none; z-index:0;
    background:radial-gradient(600px 500px at 30% 20%, var(--glow-1), transparent 60%);
    animation:float1 18s ease-in-out infinite;
  }
  body::after {
    background:radial-gradient(500px 400px at 80% 80%, var(--glow-2), transparent 60%);
    animation:float2 22s ease-in-out infinite;
  }
  @keyframes float1 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(4%, 3%) scale(1.08); } }
  @keyframes float2 { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-5%, -3%) scale(1.12); } }
  html.light body::before, html.light body::after { opacity:0.4; }
  body.no-bg::before, body.no-bg::after { display:none; }

  #app {
    position:relative; z-index:1;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    gap:6px; max-width:640px; margin:0 auto;
  }

  /* ── Вкладки ── */
  .tabs-wrap {
    display:flex; align-items:center; gap:2px;
    background:var(--bg-elev); border:1px solid var(--border);
    border-radius:var(--radius); padding:4px;
    box-shadow:var(--shadow); flex:0 0 auto;
    transition:background 0.3s, border-color 0.3s;
  }
  .tabs-arrow {
    flex:0 0 auto; width:32px; height:36px;
    background:transparent; border:none; color:var(--text-dim);
    font-size:18px; font-weight:700; cursor:pointer;
    border-radius:8px;
  }
  .tabs-arrow:active { background:var(--accent); color:#fff; transform:scale(0.9); }
  .tabs-arrow.hidden { display:none; }
  .tabs {
    flex:1; display:flex; gap:2px;
    overflow-x:auto; scrollbar-width:none; scroll-behavior:smooth;
    cursor:grab;
  }
  .tabs.dragging { cursor:grabbing; scroll-behavior:auto; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button {
    flex:0 0 auto;
    background:transparent; color:var(--text-dim);
    padding:9px 12px; font-size:12.5px; font-weight:600;
    border-radius:9px; border:none; cursor:pointer;
    white-space:nowrap; font-family:inherit;
    transition:background 0.25s, color 0.25s, transform 0.1s;
  }
  .tabs button:active { transform:scale(0.96); }
  .tabs button.active {
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    box-shadow:0 2px 12px var(--glow-1);
  }

  .panels-viewport { flex:1; overflow:hidden; position:relative; min-height:0; }
  .panels-track {
    display:flex; height:100%;
    transition:transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    will-change:transform;
  }
  .panels-track.no-transition { transition:none; }
  .panel {
    flex:0 0 100%; min-width:100%;
    display:flex; flex-direction:column; gap:6px;
    overflow-y:auto; padding-right:2px; padding-bottom:4px;
  }
  .panel::-webkit-scrollbar { width:5px; }
  .panel::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

  .topbar {
    display:flex; justify-content:space-between; align-items:center;
    padding:0 6px; font-size:12px; font-weight:600; min-height:22px;
  }
  #memLabel {
    color:var(--warning); background:rgba(255,180,84,0.12);
    padding:3px 10px; border-radius:20px;
  }
  #memLabel:empty { display:none; }
  .topbar-right { display:flex; gap:6px; align-items:center; }
  .pill {
    color:var(--accent); background:var(--glow-1);
    padding:4px 10px; border-radius:20px; cursor:pointer; font-size:12px;
    transition:background 0.2s, transform 0.1s, color 0.2s;
    user-select:none;
  }
  .pill:hover { background:var(--glow-2); }
  .pill:active { transform:scale(0.92); }
  .pill.theme { color:var(--warning); background:rgba(255,180,84,0.12); }
  #themeBtn { transition:transform 0.4s cubic-bezier(0.4, 1.6, 0.5, 1); display:inline-block; }
  #themeBtn.spin { transform:rotate(360deg); }

  .display {
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:16px 18px; text-align:right;
    display:flex; flex-direction:column; justify-content:center;
    min-height:96px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    position:relative; overflow:hidden;
    transition:background 0.3s, border-color 0.3s;
  }
  .display.flash { animation:flashScreen 0.5s ease; }
  @keyframes flashScreen {
    0% { box-shadow:var(--shadow), 0 0 0 0 var(--glow-1); }
    100% { box-shadow:var(--shadow), 0 0 0 18px transparent; }
  }
  #screen {
    font-size:36px; font-weight:500; font-variant-numeric:tabular-nums;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    line-height:1.15; letter-spacing:-0.5px;
  }
  #screen.bump { animation:screenBump 0.25s cubic-bezier(0.4, 1.6, 0.5, 1); }
  @keyframes screenBump { 0% { transform:scale(1); } 50% { transform:scale(1.04); } 100% { transform:scale(1); } }
  #screen.success { color:var(--success); }
  #screen.error { color:var(--danger); animation:shake 0.4s ease; }
  @keyframes shake {
    0%,100% { transform:translateX(0); } 20%,60% { transform:translateX(-6px); }
    40%,80% { transform:translateX(6px); }
  }
  #hint {
    font-size:12.5px; color:var(--text-dim);
    min-height:16px; margin-top:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  .grid {
    flex:1; display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-auto-rows:1fr; gap:5px; min-height:0;
  }
  button.b {
    border:none; border-radius:var(--radius-sm);
    font-size:15.5px; font-weight:600; color:var(--text);
    font-family:inherit; cursor:pointer;
    transition:transform 0.1s cubic-bezier(0.4, 1.6, 0.5, 1), filter 0.15s, background 0.3s, color 0.3s;
    padding:0; min-height:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3);
    font-variant-numeric:tabular-nums;
    position:relative; overflow:hidden;
  }
  html.light button.b { box-shadow:inset 0 1px 0 rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.06); }
  button.b:hover { filter:brightness(1.12); }
  button.b:active { transform:scale(0.94); filter:brightness(0.95); }
  .ripple {
    position:absolute; border-radius:50%;
    background:rgba(255,255,255,0.45);
    transform:scale(0); animation:ripple 0.55s ease-out;
    pointer-events:none;
  }
  html.light .ripple { background:rgba(0,0,0,0.15); }
  @keyframes ripple { to { transform:scale(4); opacity:0; } }

  .num   { background:var(--btn-num-bg);   color:var(--btn-num-text); }
  .op    { background:var(--btn-op-bg);    color:var(--btn-op-text); font-size:19px; }
  .fn    { background:var(--btn-fn-bg);    color:var(--btn-fn-text); font-size:13px; }
  .ctrl  { background:var(--btn-ctrl-bg);  color:var(--btn-ctrl-text); font-size:13px; }
  .gray  { background:var(--btn-ctrl-bg);  color:var(--btn-ctrl-text); font-size:12.5px; }
  .red   { background:linear-gradient(135deg,#ff5b6e,#d63a4d); color:#fff; }
  .green { background:linear-gradient(135deg,#3ecf8e,#22a06b); color:#fff; font-size:19px; }
  .teal  { background:linear-gradient(135deg,#2dd4bf,#189e8e); color:#04231f; font-size:12.5px; }
  .blue  { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-size:12.5px; }

  .card {
    background:var(--bg-panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px;
    box-shadow:var(--shadow);
    transition:background 0.3s, border-color 0.3s;
  }
  .card h3 {
    font-size:13px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-mute); margin-bottom:10px; font-weight:700;
  }
  .card textarea, .card input, .card select {
    background:var(--bg-elev); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:15px; width:100%;
    font-family:inherit;
    transition:border-color 0.2s, box-shadow 0.2s, background 0.3s;
  }
  .card textarea:focus, .card input:focus, .card select:focus {
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--glow-1);
  }
  .card textarea { min-height:80px; resize:vertical; font-family:'SF Mono',Consolas,monospace; font-size:14px; }
  .btn {
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none; color:#fff; font-weight:700; font-size:14px;
    padding:12px 16px; border-radius:var(--radius-sm);
    cursor:pointer; font-family:inherit;
    transition:transform 0.12s, filter 0.15s;
    position:relative; overflow:hidden;
  }
  .btn:hover { filter:brightness(1.1); }
  .btn:active { transform:scale(0.97); }
  .btn.success { background:linear-gradient(135deg,var(--success),#22a06b); }
  .btn.danger  { background:linear-gradient(135deg,#ff5b6e,#d63a4d); }
  .btn.ghost   { background:var(--bg-elev-2); color:var(--text); }
  .btn-row { display:flex; gap:6px; flex-wrap:wrap; }
  .btn-row .btn { flex:1 1 auto; }
  .output {
    background:var(--bg-elev); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 14px;
    font-family:'SF Mono',Consolas,monospace; font-size:14px;
    color:var(--text); min-height:48px;
    white-space:pre-wrap; word-break:break-word; line-height:1.6;
    transition:border-color 0.3s, background 0.3s;
  }
  .output.ok { border-color:var(--success); animation:okPulse 0.6s ease; }
  @keyframes okPulse {
    0% { box-shadow:0 0 0 0 rgba(62,207,142,0.4); }
    100% { box-shadow:0 0 0 12px rgba(62,207,142,0); }
  }
  .output.err { border-color:var(--danger); color:var(--danger); animation:shake 0.4s ease; }
  .output.update { animation:resultUpdate 0.4s cubic-bezier(0.4, 1.6, 0.5, 1); }
  @keyframes resultUpdate {
    0% { transform:scale(1); }
    50% { transform:scale(1.02); background:var(--glow-1); }
    100% { transform:scale(1); }
  }

  .modal {
    display:none; position:fixed; inset:0;
    background:rgba(6,8,12,0.75); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    z-index:100; justify-content:center; align-items:center; padding:16px;
  }
  .modal.open { display:flex; }
  .modal-box {
    background:var(--bg-elev); border:1px solid var(--border);
    border-radius:var(--radius); width:100%; max-width:480px;
    max-height:85vh; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .modal-box h3 { padding:16px 18px; font-size:16px; font-weight:700; border-bottom:1px solid var(--border); }
  .modal-content { flex:1; overflow-y:auto; padding:14px 18px; font-size:14px; line-height:1.7; }
  .modal-content .empty { color:var(--text-mute); font-style:italic; }
  .modal-btn {
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    border:none; padding:13px; font-size:14px; font-weight:700;
    color:#fff; cursor:pointer; width:100%; font-family:inherit;
  }
  .modal-btn.red { background:linear-gradient(135deg,#ff5b6e,#d63a4d); border-top:1px solid var(--border); }

  /* График */
  .graph-wrap {
    position:relative; background:var(--bg-panel);
    border:1px solid var(--border); border-radius:var(--radius);
    padding:6px; box-shadow:var(--shadow); overflow:hidden;
    transition:background 0.3s, border-color 0.3s;
  }
  #graphCanvas { width:100%; height:auto; display:block; border-radius:8px; touch-action:none; cursor:grab; }
  #graphCanvas.dragging { cursor:grabbing; }
  .graph-info {
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--text-mute);
    margin-top:6px; padding:0 8px;
    font-variant-numeric:tabular-nums;
  }
  .graph-fn-row { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .graph-fn-row .color-dot {
    flex:0 0 auto; width:14px; height:14px; border-radius:50%;
    border:2px solid var(--border); cursor:pointer;
  }
  .graph-fn-row input[type="text"] {
    flex:1; background:var(--bg-elev); color:var(--text);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:15px; font-family:inherit;
    min-width:0;
  }
  .graph-fn-row .del-btn {
    flex:0 0 auto; background:transparent; color:var(--text-dim);
    border:none; font-size:18px; cursor:pointer; padding:6px 10px;
  }
  .graph-fn-row .del-btn:disabled { opacity:0.3; }
  .graph-keys { display:grid; grid-template-columns:repeat(6, 1fr); gap:5px; }
  .graph-keys button {
    padding:11px 4px; font-size:13.5px; font-weight:600;
    background:var(--btn-num-bg); color:var(--btn-num-text);
    border:none; border-radius:9px; cursor:pointer; font-family:inherit;
    transition:background 0.3s, color 0.3s;
  }
  .graph-keys button:active { transform:scale(0.94); }
  .graph-keys button.op { background:var(--btn-op-bg); color:var(--btn-op-text); }
  .graph-keys button.fn { background:var(--btn-fn-bg); color:var(--btn-fn-text); font-size:12.5px; }
  .graph-keys button.ctrl { background:var(--btn-ctrl-bg); color:var(--btn-ctrl-text); }
  .graph-keys button.green { background:linear-gradient(135deg,#3ecf8e,#22a06b); color:#fff; }
  .graph-keys button.red { background:linear-gradient(135deg,#ff5b6e,#d63a4d); color:#fff; }
  .graph-presets { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .graph-presets button {
    padding:9px 4px; font-size:12px; font-weight:600;
    background:var(--bg-elev-2); color:var(--text);
    border:none; border-radius:9px; cursor:pointer; font-family:inherit;
    transition:background 0.3s, color 0.3s;
  }
  .graph-presets button:hover { background:var(--accent); color:#fff; }

  .bit-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .bit-grid button {
    padding:12px 4px; font-size:13px; font-weight:600;
    background:var(--btn-fn-bg); color:var(--btn-fn-text);
    border:none; border-radius:9px; cursor:pointer; font-family:inherit;
  }
  .bit-grid button:active { transform:scale(0.94); }

  .value-table { width:100%; border-collapse:collapse; font-size:13px; }
  .value-table th, .value-table td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--border); }
  .value-table th { color:var(--text-mute); font-weight:700; font-size:11px; text-transform:uppercase; }

  /* Темы */
  .theme-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; }
  .theme-swatch {
    aspect-ratio:1; border-radius:12px; cursor:pointer;
    border:3px solid transparent; transition:transform 0.15s, border-color 0.2s;
    position:relative;
  }
  .theme-swatch:hover { transform:scale(1.05); }
  .theme-swatch.active { border-color:var(--text); }
  .theme-swatch::after {
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:22px; font-weight:bold;
    opacity:0; transition:opacity 0.2s;
    text-shadow:0 2px 4px rgba(0,0,0,0.5);
  }

<script>
// ═══════════════════════════════════════════════════════
//  ЯДРО
// ═══════════════════════════════════════════════════════
const FUNCS = {
  sqrt:Math.sqrt, cbrt:Math.cbrt,
  sin:Math.sin, cos:Math.cos, tan:Math.tan,
  asin:Math.asin, acos:Math.acos, atan:Math.atan,
  sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh,
  ln:Math.log, log:Math.log10, log10:Math.log10, log2:Math.log2,
  abs:Math.abs, exp:Math.exp,
  floor:Math.floor, ceil:Math.ceil, round:Math.round, sign:Math.sign,
  mod:(a,b)=>a%b,
  factorial:(n)=>{ if(n<0||!Number.isInteger(n)) throw new Error('Факториал только для целых ≥ 0'); if(n>170) throw new Error('Слишком большое'); let r=1; for(let i=2;i<=n;i++) r*=i; return r; },
};
const CONSTS = { pi:Math.PI, e:Math.E };
let degreesMode = true;

function preprocess(expr) {
  let s = expr
    .replace(/π/g,'pi').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')
    .replace(/√/g,'__sqrt__').replace(/∛/g,'__cbrt__');
  s = replaceRoots(s,'__sqrt__','sqrt');
  s = replaceRoots(s,'__cbrt__','cbrt');

}
function replaceRoots(s, symbol, funcName) {
  let i=0, out='';
  while (i < s.length) {
    if (!s.startsWith(symbol, i)) { out += s[i]; i++; continue; }
    i += symbol.length;
    let sign = '';
    if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
    let arg = '';
    if (s[i] === '(') {
      let depth=1, j=i+1;
      while (j<s.length && depth>0) { if (s[j]==='(') depth++; else if (s[j]===')') depth--; j++; }
      arg = s.slice(i,j); i=j;
    } else if (s.startsWith('__sqrt__',i) || s.startsWith('__cbrt__',i)) {
      const [inner,ni] = readRootArg(s,i); arg = `(${inner})`; i = ni;
    } else if (/[0-9.]/.test(s[i])) {
      let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++;
      arg = s.slice(i,j); i=j;
    } else if (/[a-zA-Zπ]/.test(s[i])) {
      let j=i; while (j<s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;
      arg = s.slice(i,j); i=j;
      if (s[i] === '(') {
        let depth=1, k=i+1;
        while (k<s.length && depth>0) { if (s[k]==='(') depth++; else if (s[k]===')') depth--; k++; }
        arg += s.slice(i,k); i=k;
      }
    }
    out += `${funcName}(${sign}${arg})`;
  }

}
function readRootArg(s, i) {
  let sign = '';
  if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
  if (s.startsWith('__sqrt__',i) || s.startsWith('__cbrt__',i)) {
    const sym = s.startsWith('__sqrt__',i) ? '__sqrt__' : '__cbrt__';
    const fn  = sym === '__sqrt__' ? 'sqrt' : 'cbrt';
    const [inner,ni] = readRootArg(s, i + sym.length);
    return [`${fn}(${inner})`, ni];
  }
  if (s[i] === '(') {
    let depth=1, j=i+1;
    while (j<s.length && depth>0) { if (s[j]==='(') depth++; else if (s[j]===')') depth--; j++; }
    return [s.slice(i,j), j];
  }
  if (/[0-9.]/.test(s[i])) {
    let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++;
    return [s.slice(i,j), j];
  }
  let j=i; while (j<s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;

}
function tokenize(s) {
  const tokens = []; let i=0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++;
      tokens.push({type:'num', value:parseFloat(s.slice(i,j))}); i=j; continue;
    }
    if (/[a-zA-Z_]/.test(ch)) {
      let j=i; while (j<s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;

}
function parse(tokens, env) {

  const next = () => tokens[pos++];

    const t = next();
    if (!t || t.value !== val) throw new Error('Ожидалось: ' + val);
    return t;
  };
  function parseExpr() { return parseAddSub(); }
  function parseAddSub() {
    let left = parseMulDiv();
    while (peek() && (peek().value === '+' || peek().value === '-')) {
      const op = next().value; const right = parseMulDiv();
      if (op==='+' && right && right.__isPct) left = left + left*right.value/100;
      else if (op==='-' && right && right.__isPct) left = left - left*right.value/100;
      else if (op==='+') left = left + right;
      else left = left - right;
    }
    return left;
  }
  function parseMulDiv() {
    let left = parseUnary();
    while (peek() && (peek().value==='*' || peek().value==='/' || peek().value==='%')) {
      const op = next().value; const right = parseUnary();
      if (op==='*') { if (right && right.__isPct) left = left*right.value/100; else left = left*right; }
      else if (op==='/') {
        const d = (right && right.__isPct) ? right.value/100 : right;
        if (d===0) throw new Error('На ноль делить нельзя');
        left = left/d;
      } else {
        const d = (right && right.__isPct) ? right.value/100 : right;
        if (d===0) throw new Error('На ноль делить нельзя');
        left = left % d;
      }

  }

    if (peek() && peek().value==='-') { next(); return -parseUnary(); }

  function parsePower() {
    const base = parseAtom();
    if (peek() && peek().value==='^') { next(); const exp = parseUnary(); return Math.pow(base, exp); }
    return base;
  }
  function parseAtom() {
    const t = next();
    if (!t) throw new Error('Неожиданный конец');
    if (t.type==='num') {
      if (peek() && peek().value==='%') { next(); return {__isPct:true, value:t.value}; }
      return t.value;
    }
    if (t.type==='name') {
      if (env && t.value in env) {
        let v = env[t.value];
        if (peek() && peek().value==='%') { next(); return {__isPct:true, value:v}; }
        return v;
      }
      if (t.value in CONSTS) {
        let v = CONSTS[t.value];
        if (peek() && peek().value==='%') { next(); return {__isPct:true, value:v}; }
        return v;
      }
      if (t.value in FUNCS) {
        expect('(');
        let arg = parseExpr();
        expect(')');
        if (arg && arg.__isPct) arg = arg.value;
        const fn = FUNCS[t.value];
        const nameLower = t.value.toLowerCase();
        let a = arg;
        if (degreesMode && ['sin','cos','tan'].includes(nameLower)) a = a * Math.PI / 180;
        let res = fn(a);
        if (degreesMode && ['asin','acos','atan'].includes(nameLower)) res = res * 180 / Math.PI;
        if (peek() && peek().value==='%') { next(); return {__isPct:true, value:res}; }
        return res;
      }
      throw new Error('Неизвестное имя: ' + t.value);
    }
    if (t.value==='(') {
      const val = parseExpr();
      expect(')');
      if (peek() && peek().value==='%') { next(); return {__isPct:true, value:val}; }
      return val;
    }
    throw new Error('Неожиданный токен: ' + t.value);
  }
  const result = parseExpr();
  if (pos < tokens.length) throw new Error('Лишний токен: ' + tokens[pos].value);

  return result;
}
function safeEval(expr, env) { return parse(tokenize(preprocess(expr)), env); }
function safeEvalX(expr, x) {
  let prepared = smartMathInput(expr);
  prepared = preprocess(prepared);
  return parse(tokenize(prepared), { x });
}
function fmt(v) {
  if (typeof v === 'number') {
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return String(v);
    return String(parseFloat(v.toPrecision(12)));
  }
  return String(v);
}
function engineering(v) {
  if (!Number.isFinite(v) || v === 0) return fmt(v);
  const abs = Math.abs(v);
  if (abs >= 1e-3 && abs < 1e6) return fmt(v);
  const exp = Math.floor(Math.log10(abs) / 3) * 3;
  const mant = v / Math.pow(10, exp);
  return `${fmt(mant)}·10^${exp}`;
}
function smartMathInput(s) {
  let r = s;
  r = r.replace(/π/g, 'pi');
  r = r.replace(/(\d)([a-zA-Z(√])/g, '$1*$2');
  r = r.replace(/([a-zA-Z)])(\d+)/g, '$1^$2');
  r = r.replace(/\)\s*\(/g, ')*(');
  r = r.replace(/([a-zA-Z0-9)])(\()/g, '$1*$2');
  r = r.replace(/([a-zA-Z])\s*([a-zA-Z])/g, function(m, a, b) {
    const known = ['sin','cos','tan','ln','log','pi','abs','sqrt','exp','ctg','sec','csc','e'];
    if (known.includes(a) || known.includes(b)) return m;
    return a + '*' + b;
  });

  return r;
}

// ═══════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════
const STORE = {
  get(k, def) { try { const v = localStorage.getItem('calc_'+k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem('calc_'+k, JSON.stringify(v)); } catch {} }
};

// ═══════════════════════════════════════════════════════
//  ЗВУК / ВИБРАЦИЯ / КОНФЕТТИ / TOAST
// ═══════════════════════════════════════════════════════
let audioCtx = null;
function playClick() {
  if (!STORE.get('sound', false)) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 800; o.type = 'sine';
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    o.start(); o.stop(audioCtx.currentTime + 0.05);
  } catch {}
}
function haptic(type) {
  if (!STORE.get('vibrate', true)) return;
  try {
    if (!navigator.vibrate) return;
    if (type === 'success') navigator.vibrate([15, 30, 15]);
    else if (type === 'error') navigator.vibrate([40, 30, 40]);
    else navigator.vibrate(8);
  } catch {}
}
function fireConfetti() {
  if (!STORE.get('confetti', true)) return;
  const colors = ['#5b9dff','#7c5cff','#3ecf8e','#ffb454','#ff5b6e','#2dd4bf'];
  const container = document.getElementById('confetti');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = '-20px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.2) + 's';
    p.style.animationDuration = (1.5 + Math.random()) + 's';
    container.appendChild(p);
    setTimeout(() => p.remove(), 2500);
  }
}
let toastTimer = null;

  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}
function pulseOutput(el) {
  if (!el) return;
  el.classList.remove('update');
  void el.offsetWidth;
  el.classList.add('update');
}

//  ТЕМЫ — сохранение и полная перекраска
// ═══════════════════════════════════════════════════════
function applyTheme() {
  const theme = STORE.get('theme', 'dark');
  const accent = STORE.get('accent', 'blue');

  // Сбрасываем классы
  document.documentElement.classList.remove('light','accent-emerald','accent-rose','accent-amber','accent-teal','accent-violet','accent-pink');

  // Базовая тема
  if (theme === 'light') document.documentElement.classList.add('light');

  // Акцентная тема
  if (accent && accent !== 'blue' && accent !== 'custom') {
    document.documentElement.classList.add('accent-' + accent);
  }
  // Своя тема — через inline CSS-переменные
  if (accent === 'custom') {
    const c1 = STORE.get('customAccent1', '#5b9dff');
    const c2 = STORE.get('customAccent2', '#7c5cff');
    const s = document.documentElement.style;
    s.setProperty('--accent', c1);
    s.setProperty('--accent-2', c2);
    s.setProperty('--glow-1', hexA(c1, theme === 'light' ? 0.18 : 0.12));
    s.setProperty('--glow-2', hexA(c2, theme === 'light' ? 0.18 : 0.12));
  } else {
    document.documentElement.style.removeProperty('--accent');
    document.documentElement.style.removeProperty('--accent-2');
    document.documentElement.style.removeProperty('--glow-1');
    document.documentElement.style.removeProperty('--glow-2');
  }

  // Кнопка темы
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'light' ? '☀️' : '🌙';

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#eef1f7' : '#0e1116');

  // Перерисовать график
  if (currentTab === 'graph') setTimeout(drawGraph, 80);
}

function hexA(hex, a) {
  hex = hex.replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const r = parseInt(hex.slice(0,2),16);
  const g = parseInt(hex.slice(2,4),16);
  const b = parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function applyBg() {
  const on = STORE.get('bg', true);
  document.body.classList.toggle('no-bg', !on);
}

let currentTab = 'basic';
let currentTabIndex = 0;

const tabsScroll = document.getElementById('tabsScroll');
const panelsTrack = document.getElementById('panelsTrack');
const panelsViewport = document.getElementById('panelsViewport');
const tabsLeft = document.getElementById('tabsLeft');
const tabsRight = document.getElementById('tabsRight');

TABS.forEach((tab, i) => {
  const b = document.createElement('button');
  b.dataset.tab = tab.id;
  b.innerHTML = `${tab.icon} ${tab.label}`;
  if (i === 0) b.classList.add('active');
  b.addEventListener('click', () => switchTab(tab.id));
  tabsScroll.appendChild(b);

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.dataset.panel = tab.id;
  panelsTrack.appendChild(panel);
});

function getPanel(id) { return document.querySelector(`.panel[data-panel="${id}"]`); }

function switchTab(name) {
  const idx = TABS.findIndex(t => t.id === name);
  if (idx < 0) return;
  currentTab = name;
  currentTabIndex = idx;

  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  const activeBtn = document.querySelector(`.tabs button[data-tab="${name}"]`);
  if (activeBtn) activeBtn.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });

  panelsTrack.style.transform = `translateX(${-idx * 100}%)`;

  if (name === 'stats') renderStats();
  if (name === 'graph') setTimeout(() => drawGraph(), 80);
  if (name === 'settings') renderThemePicker();
  updateTabsArrows();
}

function updateTabsArrows() {
  const sl = tabsScroll.scrollLeft;
  const maxScroll = tabsScroll.scrollWidth - tabsScroll.clientWidth;
  tabsLeft.classList.toggle('hidden', sl <= 2);
  tabsRight.classList.toggle('hidden', sl >= maxScroll - 2);
}
tabsScroll.addEventListener('scroll', updateTabsArrows, { passive: true });
window.addEventListener('resize', updateTabsArrows);
tabsLeft.addEventListener('click', () => tabsScroll.scrollBy({ left: -150, behavior: 'smooth' }));
tabsRight.addEventListener('click', () => tabsScroll.scrollBy({ left: 150, behavior: 'smooth' }));

// Свайп вкладок
let tabDragStart = null, tabDragScroll = 0;
tabsScroll.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') return;
  tabDragStart = e.clientX; tabDragScroll = tabsScroll.scrollLeft;
  tabsScroll.classList.add('dragging');
});
tabsScroll.addEventListener('pointermove', (e) => {
  if (tabDragStart === null) return;
  tabsScroll.scrollLeft = tabDragScroll - (e.clientX - tabDragStart);
});
tabsScroll.addEventListener('pointerup', () => { tabDragStart = null; tabsScroll.classList.remove('dragging'); });
tabsScroll.addEventListener('pointercancel', () => { tabDragStart = null; tabsScroll.classList.remove('dragging'); });

// Свайп панелей (палец)
let panelTouchStart = null, panelDragLocked = false;
panelsViewport.addEventListener('touchstart', (e) => {
  if (e.target.closest('button, input, textarea, select, canvas, a')) return;
  if (e.touches.length !== 1) return;
  panelTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
  panelDragLocked = false;
  panelsTrack.classList.add('no-transition');
}, { passive: true });
panelsViewport.addEventListener('touchmove', (e) => {
  if (!panelTouchStart) return;
  const dx = e.touches[0].clientX - panelTouchStart.x;
  const dy = e.touches[0].clientY - panelTouchStart.y;
  if (!panelDragLocked) {
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
      panelTouchStart = null; panelsTrack.classList.remove('no-transition'); return;
    }
    if (Math.abs(dx) > 10) panelDragLocked = true;
  }
  if (panelDragLocked) {
    const shift = -currentTabIndex * panelsViewport.clientWidth + dx * 0.5;
    panelsTrack.style.transform = `translateX(${shift}px)`;
  }
}, { passive: true });
panelsViewport.addEventListener('touchend', (e) => {
  if (!panelTouchStart) return;
  const dx = e.changedTouches[0].clientX - panelTouchStart.x;
  const dt = Date.now() - panelTouchStart.time;
  panelsTrack.classList.remove('no-transition');
  if (panelDragLocked && (Math.abs(dx) > 60 || (Math.abs(dx) > 25 && dt < 250))) {
    if (dx < 0 && currentTabIndex < TABS.length - 1) switchTab(TABS[currentTabIndex + 1].id);
    else if (dx > 0 && currentTabIndex > 0) switchTab(TABS[currentTabIndex - 1].id);
    else switchTab(TABS[currentTabIndex].id);
  } else switchTab(TABS[currentTabIndex].id);
  panelTouchStart = null; panelDragLocked = false;
});
// Свайп мышью
let panelMouseStart = null;
panelsViewport.addEventListener('mousedown', (e) => {
  if (e.target.closest('button, input, textarea, select, canvas, a')) return;
  panelMouseStart = { x: e.clientX, index: currentTabIndex };
  panelsTrack.classList.add('no-transition');
});
window.addEventListener('mousemove', (e) => {
  if (!panelMouseStart) return;
  const dx = e.clientX - panelMouseStart.x;
  if (Math.abs(dx) > 5) {
    const shift = -panelMouseStart.index * panelsViewport.clientWidth + dx * 0.5;
    panelsTrack.style.transform = `translateX(${shift}px)`;
  }
});
window.addEventListener('mouseup', (e) => {
  if (!panelMouseStart) return;
  const dx = e.clientX - panelMouseStart.x;
  panelsTrack.classList.remove('no-transition');
  if (dx < -80 && currentTabIndex < TABS.length - 1) switchTab(TABS[currentTabIndex + 1].id);
  else if (dx > 80 && currentTabIndex > 0) switchTab(TABS[currentTabIndex - 1].id);
  else switchTab(TABS[currentTabIndex].id);
  panelMouseStart = null;
});

function pushUndo() { undoStack.push(expression); if (undoStack.length > 100) undoStack.shift(); redoStack = []; }
function undo() { if (!undoStack.length) return; redoStack.push(expression); expression = undoStack.pop(); resultShown = false; updateScreen(); }
function redo() { if (!redoStack.length) return; undoStack.push(expression); expression = redoStack.pop(); resultShown = false; updateScreen(); }
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

function updateScreen() {
  screenEl.textContent = expression || '0';
  screenEl.classList.remove('success','error');
}
function insert(text) {
  pushUndo();
  if (resultShown) {
    if (/^[0-9.(a-zA-Z√∛π]/.test(text)) expression = '';
    resultShown = false;
  }
  if (expression.length + text.length > 200) return;
  expression += text; updateScreen();
}
function onClear() { pushUndo(); expression=''; resultShown=false; hintEl.textContent=''; updateScreen(); }
function onBackspace() { pushUndo(); expression = expression.slice(0, -1); resultShown = false; updateScreen(); }
function onNegate() {
  pushUndo();
  if (!expression) expression = '-';
  else if (expression.startsWith('-')) expression = expression.slice(1);
  else expression = '-' + expression;
  updateScreen();
}
function onFactorial() { pushUndo(); if (resultShown) resultShown = false; expression = expression ? `factorial(${expression})` : 'factorial('; updateScreen(); }
function onInverse() { if (!expression) return; pushUndo(); resultShown = false; expression = `1/(${expression})`; updateScreen(); }
function onEquals() {
  if (!expression) return;
  try {
    let expr = expression;
    const open = (expr.match(/\(/g)||[]).length;
    const close = (expr.match(/\)/g)||[]).length;
    expr = expr + ')'.repeat(Math.max(0, open-close));
    const result = safeEval(expr);
    if (typeof result !== 'number' || Number.isNaN(result) || !Number.isFinite(result)) throw new Error('Результат не определён');
    displayEl.classList.add('flash');
    setTimeout(() => displayEl.classList.remove('flash'), 500);
    hintEl.textContent = expression + ' =';
    history.push([expression, fmt(result)]);
    if (history.length > 500) history = history.slice(-500);
    STORE.set('history', history);
    incrementStat('calc');
    const nice = Number.isInteger(result) || Math.abs(result - Math.PI) < 1e-9 || Math.abs(result - Math.E) < 1e-9;
    if (nice) { screenEl.classList.add('success'); fireConfetti(); haptic('success'); } else haptic('tap');
    screenEl.classList.add('bump');
    setTimeout(() => screenEl.classList.remove('bump'), 300);
    expression = engineering(result);
    resultShown = true; updateScreen();
  } catch (e) {
    hintEl.textContent = '⚠ ' + e.message;
    expression = ''; resultShown = false;
    screenEl.classList.add('error'); haptic('error');
    setTimeout(() => screenEl.classList.remove('error'), 500);
    updateScreen();
  }
}
function toggleDegrees() { degreesMode = !degreesMode; modeEl.textContent = degreesMode ? 'DEG' : 'RAD'; }
function memUpdate() { memEl.textContent = memory ? 'M · ' + fmt(memory) : ''; STORE.set('memory', memory); }
function memClear()  { memory = 0; memUpdate(); }
function memRecall() { if (resultShown) resultShown = false; expression += fmt(memory); updateScreen(); }
function memAdd()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory += v; memUpdate(); } catch(e){} }
function memSub()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory -= v; memUpdate(); } catch(e){} }

function addRipple(btn, event) {
  const rect = btn.getBoundingClientRect();
  const x = (event.clientX || (event.touches && event.touches[0].clientX) || rect.left + rect.width/2) - rect.left;
  const y = (event.clientY || (event.touches && event.touches[0].clientY) || rect.top + rect.height/2) - rect.top;
  const r = Math.max(rect.width, rect.height);
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.left = (x - r/2) + 'px'; ripple.style.top = (y - r/2) + 'px';
  ripple.style.width = r + 'px'; ripple.style.height = r + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

});

function handleGraphKey(cmd) {
  const input = graphFnsEl.querySelector(`input[data-idx="${activeFnIndex}"]`);
  if (!input) return;
  if (cmd === '__BACK__') {
    const s = input.selectionStart, e = input.selectionEnd;
    if (s !== e) input.value = input.value.slice(0, s) + input.value.slice(e);
    else if (s > 0) input.value = input.value.slice(0, s - 1) + input.value.slice(s);
    input.focus();
  } else if (cmd === '__CLEAR__') { input.value = ''; input.focus(); }
  else if (cmd === '__DRAW__') { drawGraph(); return; }
  else {
    const s = input.selectionStart, e = input.selectionEnd;
    input.value = input.value.slice(0, s) + cmd + input.value.slice(e);
    input.selectionStart = input.selectionEnd = s + cmd.length;
    input.focus();
  }
  graphFns[activeFnIndex].expr = input.value;
  STORE.set('graphFns', graphFns);
  scheduleDraw();
}

function drawGraph() {
  if (!graphCanvas) return;
  const wrap = graphCanvas.parentElement;
  if (wrap.clientWidth === 0) return;
  const w = wrap.clientWidth - 12;
  const h = Math.max(180, Math.min(300, w * 0.55));
  const dpr = window.devicePixelRatio || 1;
  graphCanvas.width = w * dpr;
  graphCanvas.height = h * dpr;
  graphCanvas.style.width = w + 'px';
  graphCanvas.style.height = h + 'px';
  const ctx = graphCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const style = getComputedStyle(document.documentElement);
  const cBg    = style.getPropertyValue('--bg-elev').trim() || '#161a21';
  const cText  = style.getPropertyValue('--text-dim').trim() || '#8b95a5';
  const cAxis  = style.getPropertyValue('--text-mute').trim() || '#5b6473';
  const cGrid  = style.getPropertyValue('--border').trim() || '#262c36';

  ctx.fillStyle = cBg; ctx.fillRect(0, 0, w, h);

  const cx = w/2 - graphCenter.x * (w / (2*graphRange));
  const cy = h/2 + graphCenter.y * (h / (2*graphRange));
  const scale = w / (2 * graphRange);

  ctx.strokeStyle = cGrid; ctx.globalAlpha = 0.4; ctx.lineWidth = 1;
  const step = graphRange <= 5 ? 0.5 : (graphRange <= 20 ? 1 : 2);
  for (let x = -100; x <= 100; x += step) {
    const px = cx + x * scale;
    if (px < 0 || px > w) continue;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
  }
  for (let y = -100; y <= 100; y += step) {
    const py = cy - y * scale;
    if (py < 0 || py > h) continue;
    ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(w, py); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.strokeStyle = cAxis; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();

  ctx.fillStyle = cText; ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'center';
  const labelStep = graphRange <= 5 ? 1 : (graphRange <= 20 ? 5 : 10);
  for (let x = -100; x <= 100; x += labelStep) {
    const px = cx + x * scale;
    if (px < 18 || px > w - 18 || x === 0) continue;
    ctx.fillText(String(x), px, cy + 12);
  }
  ctx.textAlign = 'right';
  for (let y = -100; y <= 100; y += labelStep) {
    const py = cy - y * scale;
    if (py < 10 || py > h - 4 || y === 0) continue;
    ctx.fillText(String(y), cx - 4, py + 3);
  }

  graphFns.forEach(fn => {
    if (!fn.visible || !fn.expr.trim()) return;
    ctx.strokeStyle = fn.color; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
    ctx.beginPath();
    let started = false;
    for (let px = 0; px <= w; px++) {
      const x = (px - cx) / scale;
      let y;
      try { y = safeEvalX(fn.expr, x); } catch { started = false; continue; }
      if (!Number.isFinite(y)) { started = false; continue; }
      const py = cy - y * scale;
      if (py < -h*2 || py > h*3) { started = false; continue; }
      if (!started) { ctx.moveTo(px, py); started = true; }
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  });

  document.getElementById('graphRangeX').textContent = `x ∈ [${fmt(graphCenter.x - graphRange)}, ${fmt(graphCenter.x + graphRange)}]`;
  document.getElementById('graphRangeY').textContent = `y ∈ [${fmt(graphCenter.y - graphRange)}, ${fmt(graphCenter.y + graphRange)}]`;
}

graphCanvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, cx: graphCenter.x, cy: graphCenter.y };
  else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStart = { dist: Math.hypot(dx, dy), range: graphRange };
  }
}, { passive: true });
graphCanvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && dragStart) {
    const rect = graphCanvas.getBoundingClientRect();
    const scale = rect.width / (2 * dragStart.range);
    graphCenter.x = dragStart.cx - (e.touches[0].clientX - dragStart.x) / scale;
    graphCenter.y = dragStart.cy + (e.touches[0].clientY - dragStart.y) / scale;
    scheduleDraw();
  } else if (e.touches.length === 2 && pinchStart) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    graphRange = Math.max(0.5, Math.min(200, pinchStart.range * (pinchStart.dist / dist)));

  }
}, { passive: true });

document.getElementById('solveIneq').addEventListener('click', () => {
  const a = parseFloat(document.getElementById('ineqA').value) || 0;
  const b = parseFloat(document.getElementById('ineqB').value) || 0;
  const c = parseFloat(document.getElementById('ineqC').value) || 0;
  const sign = document.getElementById('ineqSign').value;
  const out = document.getElementById('ineqOut');
  if (a === 0) { out.className = 'output err'; out.textContent = 'Не квадратное'; return; }
  const D = b*b - 4*a*c;
  let answer = '';
  if (D < 0) answer = a > 0 ? 'x ∈ ℝ' : 'нет решений';
  else if (D === 0) {
    const x = -b/(2*a);
    if ((a>0&&(sign==='gt'||sign==='ge'))||(a<0&&(sign==='lt'||sign==='le'))) {
      answer = (sign==='gt'||sign==='lt') ? `x ∈ ℝ \\ {${fmt(x)}}` : 'x ∈ ℝ';
    } else answer = 'нет решений';
  } else {
    const x1 = (-b-Math.sqrt(D))/(2*a), x2 = (-b+Math.sqrt(D))/(2*a);
    const [lo, hi] = x1<x2 ? [x1,x2] : [x2,x1];
    if (a>0) {
      if (sign==='gt') answer = `x ∈ (−∞, ${fmt(lo)}) ∪ (${fmt(hi)}, +∞)`;
      else if (sign==='ge') answer = `x ∈ (−∞, ${fmt(lo)}] ∪ [${fmt(hi)}, +∞)`;
      else if (sign==='lt') answer = `x ∈ (${fmt(lo)}, ${fmt(hi)})`;
      else answer = `x ∈ [${fmt(lo)}, ${fmt(hi)}]`;
    } else {
      if (sign==='gt') answer = `x ∈ (${fmt(lo)}, ${fmt(hi)})`;
      else if (sign==='ge') answer = `x ∈ [${fmt(lo)}, ${fmt(hi)}]`;
      else if (sign==='lt') answer = `x ∈ (−∞, ${fmt(lo)}) ∪ (${fmt(hi)}, +∞)`;
      else answer = `x ∈ (−∞, ${fmt(lo)}] ∪ [${fmt(hi)}, +∞)`;
    }
  }
  out.className = 'output ok'; out.textContent = `D = ${fmt(D)}\nОтвет: ${answer}`;
  pulseOutput(out); incrementStat('calc');
});

function fact(n) { if (n<0||!Number.isInteger(n)) throw new Error('n ≥ 0'); let r=1; for (let i=2;i<=n;i++) r*=i; return r; }
function C(n,k) { if (k<0||k>n) return 0; return fact(n)/(fact(k)*fact(n-k)); }
function A(n,k) { if (k<0||k>n) return 0; return fact(n)/fact(n-k); }

document.getElementById('binomBtn').addEventListener('click', () => {
  const a = parseFloat(document.getElementById('binomA').value)||0;
  const b = parseFloat(document.getElementById('binomB').value)||0;
  const n = parseInt(document.getElementById('binomN').value)||0;
  const out = document.getElementById('binomOut');
  if (n<0||n>10) { out.className='output err'; out.textContent='n от 0 до 10'; return; }
  const parts = [];
  for (let k=0;k<=n;k++) {
    const c = C(n,k);
    const ap = n-k, bp = k;
    let term = '';
    if (c !== 1 || (ap === 0 && bp === 0)) term += fmt(c);
    if (ap > 0) term += (term && !term.endsWith('·') ? '·' : '') + (a===1?'':fmt(a)) + 'a' + (ap>1?'^'+ap:'');
    if (bp > 0) term += (term && !term.endsWith('·') ? '·' : '') + (b===1?'':fmt(b)) + 'b' + (bp>1?'^'+bp:'');
    if (!term) term = '1';
    parts.push(term);
  }
  out.className='output ok'; out.textContent = parts.join(' + ');
  pulseOutput(out); incrementStat('calc');
});

  const out = document.getElementById('statOut');

    if (!arr.length) throw new Error('Введите числа');
    const n = arr.length;
    const mean = arr.reduce((a,b)=>a+b,0)/n;
    const sorted = [...arr].sort((a,b)=>a-b);
    const median = n%2 ? sorted[(n-1)/2] : (sorted[n/2-1]+sorted[n/2])/2;
    const variance = arr.reduce((s,x)=>s+(x-mean)**2,0)/n;
    out.className='output ok';
    out.textContent = `n=${n}\nСреднее=${fmt(mean)}\nМедиана=${fmt(median)}\nσ=${fmt(Math.sqrt(variance))}`;
    pulseOutput(out); incrementStat('calc');
  } catch(e) { out.className='output err'; out.textContent = e.message; }
});

      <button class="btn" id="mtxCreateA">Создать матрицу A</button>
    </div>`;
    document.getElementById('mtxCreateA').addEventListener('click', () => openMatrixModal('A'));
    return;
  }
  el.innerHTML = `
    <div class="mtx-pair">
      <div class="mtx-card">
        <div class="mtx-card-head"><span class="name">A</span><span class="size">${matrixA ? matrixA.rows+'×'+matrixA.cols : ''}</span></div>
        <div class="mtx-preview">${renderMatrixPreview(matrixA)}</div>
        <button class="mtx-edit" data-target="A">${matrixA?'Изменить':'Создать'}</button>
      </div>
      <div class="mtx-card">
        <div class="mtx-card-head"><span class="name">B</span><span class="size">${matrixB ? matrixB.rows+'×'+matrixB.cols : ''}</span></div>
        <div class="mtx-preview">${renderMatrixPreview(matrixB)}</div>
        <button class="mtx-edit" data-target="B">${matrixB?'Изменить':'Создать'}</button>
      </div>
    </div>
    ${matrixA ? `<div class="mtx-ops"><div class="mtx-ops-title">С матрицей A</div>
      <div class="mtx-ops-row">
        <button data-op="transpose">Трансп.</button><button data-op="det">Опред.</button>
        <button data-op="trace">След</button><button data-op="scale">×k</button>
      </div></div>` : ''}
    ${matrixA && matrixB ? `<div class="mtx-ops"><div class="mtx-ops-title">С двумя</div>
      <div class="mtx-ops-row">
        <button class="success" data-op="add">A+B</button>
        <button class="success" data-op="sub">A−B</button>
        <button class="success" data-op="mul">A×B</button>
      </div></div>` : ''}
    ${matrixResult ? renderMatrixResult(matrixResult) : ''}
    <div class="mtx-ops"><div class="mtx-ops-row">
      <button data-op="identity" style="grid-column:span 2">E(n)</button>
      <button data-op="clearresult" style="grid-column:span 2">Сброс</button>
    </div></div>
  `;
  el.querySelectorAll('[data-target]').forEach(b => b.addEventListener('click', () => openMatrixModal(b.dataset.target)));
  el.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => handleMatrixOp(b.dataset.op)));
}
function handleMatrixOp(op) {
  try {
    if (op==='transpose') matrixResult = mTranspose(matrixA);
    else if (op==='det') matrixResult = mDet(matrixA);
    else if (op==='trace') matrixResult = mTrace(matrixA);
    else if (op==='scale') { const k = parseFloat(prompt('k:','2')); if (isNaN(k)) return; matrixResult = mScale(matrixA,k); }
    else if (op==='add') matrixResult = mAdd(matrixA, matrixB);
    else if (op==='sub') matrixResult = mSub(matrixA, matrixB);
    else if (op==='mul') matrixResult = mMul(matrixA, matrixB);
    else if (op==='identity') { const n = parseInt(prompt('n:','3')); if (!n||n<1||n>6) return; matrixResult = mIdentity(n); }
    else if (op==='clearresult') matrixResult = null;
    renderMatrixPanel(); incrementStat('calc');
  } catch(e) { showToast('⚠ ' + e.message); }
}
function mAdd(a,b) { if (a.rows!==b.rows||a.cols!==b.cols) throw new Error('Размеры не совпадают'); return {rows:a.rows,cols:a.cols,data:a.data.map((r,i)=>r.map((v,j)=>v+b.data[i][j]))}; }
function mSub(a,b) { if (a.rows!==b.rows||a.cols!==b.cols) throw new Error('Размеры не совпадают'); return {rows:a.rows,cols:a.cols,data:a.data.map((r,i)=>r.map((v,j)=>v-b.data[i][j]))}; }
function mMul(a,b) {
  if (a.cols !== b.rows) throw new Error('A.cols ≠ B.rows');
  const r = Array.from({length:a.rows}, () => Array(b.cols).fill(0));
  for (let i=0;i<a.rows;i++) for (let j=0;j<b.cols;j++) for (let k=0;k<a.cols;k++) r[i][j] += a.data[i][k]*b.data[k][j];
  return {rows:a.rows,cols:b.cols,data:r};
}
function mTranspose(a) { return {rows:a.cols,cols:a.rows,data:Array.from({length:a.cols},(_,i)=>a.data.map(r=>r[i]))}; }
function mDet(a) {
  if (a.rows !== a.cols) throw new Error('Только квадратная');
  const n = a.rows, m = a.data.map(r => [...r]);
  let det = 1;
  for (let i=0;i<n;i++) {
    let p = i;
    for (let j=i+1;j<n;j++) if (Math.abs(m[j][i])>Math.abs(m[p][i])) p = j;
    if (Math.abs(m[p][i])<1e-12) return 0;
    if (p !== i) { [m[i],m[p]] = [m[p],m[i]]; det = -det; }
    det *= m[i][i];
    for (let j=i+1;j<n;j++) { const f = m[j][i]/m[i][i]; for (let k=i;k<n;k++) m[j][k] -= f*m[i][k]; }
  }
  return det;
}
function mTrace(a) { if (a.rows!==a.cols) throw new Error('Только квадратная'); let s=0; for (let i=0;i<a.rows;i++) s += a.data[i][i]; return s; }
function mScale(a,k) { return {rows:a.rows,cols:a.cols,data:a.data.map(r=>r.map(v=>v*k))}; }
function mIdentity(n) { return {rows:n,cols:n,data:Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0))}; }

  'Длина': { units:['м','см','мм','км','фут','дюйм','миля'], convert:(v,f,t)=>{const m={'м':1,'см':0.01,'мм':0.001,'км':1000,'фут':0.3048,'дюйм':0.0254,'миля':1609.344};return v*m[f]/m[t];} },
  'Масса': { units:['кг','г','мг','фунт','унция'], convert:(v,f,t)=>{const kg={'кг':1,'г':0.001,'мг':1e-6,'фунт':0.453592,'унция':0.0283495};return v*kg[f]/kg[t];} },

  'Объём': { units:['л','мл','м³','галлон'], convert:(v,f,t)=>{const l={'л':1,'мл':0.001,'м³':1000,'галлон':3.78541};return v*l[f]/l[t];} },
  'Скорость': { units:['м/с','км/ч','миль/ч'], convert:(v,f,t)=>{const ms={'м/с':1,'км/ч':1/3.6,'миль/ч':0.44704};return v*ms[f]/ms[t];} },

const pomoTimeEl = document.getElementById('pomoTime');
function updatePomo() {
  const m = Math.floor(pomoTime/60), s = pomoTime % 60;
  pomoTimeEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    else {
      clearInterval(pomoInterval); pomoRunning = false;
      pomoTimeEl.classList.remove('ticking');
      incrementStat('pomo'); haptic('success'); fireConfetti();
      showToast(pomoMode==='work'?'✓ Работа завершена!':'✓ Отдых завершён!');
      pomoMode = pomoMode==='work'?'break':'work';
      pomoTime = pomoMode==='work'?25*60:5*60;
      updatePomo();
    }
  }, 1000);
});

function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function incrementStat(type) {
  const stats = STORE.get('stats', {total:0, pomos:0, days:{}});
  if (type==='calc') stats.total = (stats.total||0) + 1;
  if (type==='pomo') stats.pomos = (stats.pomos||0) + 1;
  const k = todayKey();
  stats.days = stats.days || {};
  stats.days[k] = (stats.days[k]||0) + 1;
  STORE.set('stats', stats);
}
function renderStats() {
  const stats = STORE.get('stats', {total:0, pomos:0, days:{}});
  document.getElementById('statTotal').textContent = stats.total || 0;
  document.getElementById('statToday').textContent = (stats.days && stats.days[todayKey()]) || 0;
  document.getElementById('statPomos').textContent = stats.pomos || 0;
  const chart = document.getElementById('statChart');
  chart.innerHTML = '';
  const days = [];
  for (let i=6;i>=0;i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    days.push({ label:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()], value:(stats.days && stats.days[key])||0 });
  }
  const max = Math.max(...days.map(d=>d.value), 1);
  days.forEach(d => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end';
    const bar = document.createElement('div');
    bar.style.cssText = `width:100%;background:linear-gradient(180deg,var(--accent),var(--accent-2));border-radius:4px 4px 0 0;min-height:4px;height:${(d.value/max)*90}%`;
    const lbl = document.createElement('div');
    lbl.style.cssText = 'font-size:10px;color:var(--text-mute);font-weight:600';
    lbl.textContent = d.label;
    const cnt = document.createElement('div');
    cnt.style.cssText = 'font-size:11px;color:var(--text);font-weight:700';
    cnt.textContent = d.value;
    wrap.appendChild(cnt); wrap.appendChild(bar); wrap.appendChild(lbl);
    chart.appendChild(wrap);
  });
}
