<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Калькулятор Pro</title>
<style>
  :root {
    --bg:        #0e1116;
    --bg-elev:   #161a21;
    --bg-elev-2: #1d222b;
    --bg-panel:  #11151b;
    --border:    #262c36;
    --text:      #e8ecf2;
    --text-dim:  #8b95a5;
    --text-mute: #5b6473;

    --accent:    #5b9dff;
    --accent-2:  #7c5cff;
    --success:   #3ecf8e;
    --danger:    #ff5b6e;
    --warning:   #ffb454;
    --teal:      #2dd4bf;

    --radius:    14px;
    --radius-sm: 10px;
    --shadow:    0 4px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background:
      radial-gradient(600px 400px at 20% 0%, rgba(91,157,255,0.08), transparent 60%),
      radial-gradient(500px 400px at 100% 100%, rgba(124,92,255,0.08), transparent 60%);
    pointer-events: none; z-index: 0;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    gap: 8px; max-width: 540px; margin: 0 auto;
  }

  /* ── Вкладки ── */
  .tabs {
    display: flex; gap: 2px;
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 4px;
    overflow-x: auto; scrollbar-width: none; box-shadow: var(--shadow);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 1 1 auto; min-width: 0;
    background: transparent; color: var(--text-dim);
    padding: 10px 8px; font-size: 13px; font-weight: 600;
    border-radius: 10px; border: none; cursor: pointer;
    white-space: nowrap; transition: background 0.18s, color 0.18s;
  }
  .tabs button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; box-shadow: 0 2px 10px rgba(91,157,255,0.35);
  }

  /* ── Панели ── */
  .panel { display: none; flex: 1; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; }
  .panel.active { display: flex; }

  /* ── Верхняя строка ── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 6px; font-size: 12px; font-weight: 600; min-height: 20px;
  }
  #memLabel {
    color: var(--warning); background: rgba(255,180,84,0.12);
    padding: 3px 10px; border-radius: 20px;
  }
  #memLabel:empty { display: none; }
  #modeBtn {
    color: var(--accent); background: rgba(91,157,255,0.12);
    padding: 3px 12px; border-radius: 20px; cursor: pointer;
  }

  /* ── Дисплей ── */
  .display {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; text-align: right;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 108px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }
  #screen {
    font-size: 38px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.15; color: #fff; letter-spacing: -0.5px;
  }
  #hint {
    font-size: 13px; color: var(--text-dim);
    min-height: 17px; margin-top: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ── Сетка кнопок ── */
  .grid {
    flex: 1; display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr; gap: 6px; min-height: 0;
  }
  button.b {
    border: none; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 600; color: var(--text);
    font-family: inherit; cursor: pointer;
    transition: transform 0.08s, filter 0.15s, background 0.15s;
    padding: 0; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.3);
    font-variant-numeric: tabular-nums;
  }
  button.b:hover { filter: brightness(1.12); }
  button.b:active { transform: scale(0.96); filter: brightness(0.95); }

  .num   { background: #232935;   color: #fff; }
  .op    { background: #3a2f4d;   color: #c9b8ff; font-size: 20px; }
  .fn    { background: #2a2f4a;   color: #a8b8ff; font-size: 14px; }
  .ctrl  { background: var(--bg-elev-2); color: var(--text-dim); font-size: 14px; }
  .gray  { background: var(--bg-elev-2); color: var(--text-dim); font-size: 13px; }
  .red   { background: linear-gradient(135deg, #ff5b6e, #d63a4d); color: #fff; }
  .green { background: linear-gradient(135deg, var(--success), #22a06b); color: #fff; font-size: 20px; }
  .teal  { background: linear-gradient(135deg, var(--teal), #189e8e); color: #04231f; font-size: 13px; }
  .blue  { background: linear-gradient(135deg, var(--accent), #3a7fe0); color: #fff; font-size: 13px; }
  .big-span { grid-column: span 2; }

  /* ── Модалки ── */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(6, 8, 12, 0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    z-index: 100; justify-content: center; align-items: center; padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--bg-elev); border: 1px solid var(--border);
    border-radius: var(--radius); width: 100%; max-width: 440px;
    max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: slideUp 0.2s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal-box h3 {
    padding: 18px 20px; font-size: 17px; font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .modal-content {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    font-size: 14px; line-height: 1.7; color: var(--text);
  }
  .modal-content .empty { color: var(--text-mute); font-style: italic; }
  .modal-content input, .modal-content select {
    background: var(--bg-panel); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; font-size: 16px; width: 100%; margin: 4px 0;
    font-family: inherit; transition: border-color 0.15s;
  }
  .modal-content input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.15);
  }
  .modal-content label {
    display: block; color: var(--text-dim);
    font-size: 12px; font-weight: 600; margin-top: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .modal-btn {
    background: linear-gradient(135deg, var(--accent), #3a7fe0);
    border: none; padding: 14px; font-size: 14px; font-weight: 700;
    color: #fff; cursor: pointer; width: 100%;
  }
  .modal-btn.red {
    background: linear-gradient(135deg, #ff5b6e, #d63a4d);
    border-top: 1px solid var(--border);
  }

  /* ═══════════════════════════════════════════════════
     ДРОБИ — упрощённый интерфейс
     ═══════════════════════════════════════════════════ */
  .frac-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow);
  }
  .frac-row {
    display: flex; align-items: center; gap: 12px; justify-content: center;
  }
  .frac-input {
    display: flex; flex-direction: column; align-items: center;
    width: 100px;
  }
  .frac-input input {
    width: 100%; text-align: center;
    background: #0b0d10; border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px; font-size: 22px; font-weight: 600;
    color: #fff; font-family: inherit;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.15s;
  }
  .frac-input input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.15);
  }
  .frac-input.den input { border-color: #3a4250; }
  .frac-line {
    width: 100%; height: 3px; background: #3a4250;
    border-radius: 2px; margin: 4px 0;
  }
  .frac-op {
    font-size: 32px; font-weight: 300; color: var(--text-dim);
    padding: 0 4px;
  }
  .frac-actions {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .frac-actions button {
    padding: 14px 8px; font-size: 15px; font-weight: 700;
    border-radius: var(--radius-sm); border: none; cursor: pointer;
    color: #fff; font-family: inherit;
    transition: transform 0.08s, filter 0.15s;
  }
  .frac-actions button:active { transform: scale(0.96); }
  .frac-actions .equals {
    background: linear-gradient(135deg, var(--success), #22a06b);
    font-size: 18px;
  }
  .frac-actions .clear {
    background: linear-gradient(135deg, #ff5b6e, #d63a4d);
  }
  .frac-actions .swap {
    background: var(--bg-elev-2); color: var(--text);
  }
  .frac-output {
    background: #0b0d10; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    text-align: center; min-height: 90px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 6px;
  }
  .frac-output-main {
    font-size: 28px; font-weight: 600; color: #fff;
    font-variant-numeric: tabular-nums;
    font-family: 'SF Mono', 'Consolas', monospace;
  }
  .frac-output-main .frac-inline {
    display: inline-flex; flex-direction: column; align-items: center;
    line-height: 1;
  }
  .frac-output-main .frac-inline .n {
    padding: 0 10px 3px; border-bottom: 2px solid #fff;
  }
  .frac-output-main .frac-inline .d { padding: 3px 10px 0; }
  .frac-output-decimal {
    font-size: 15px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .frac-hint {
    font-size: 12px; color: var(--text-mute);
    text-align: center; margin-top: 4px;
  }
  .frac-hint b { color: var(--text-dim); font-weight: 600; }

  /* ═══════════════════════════════════════════════════
     МАТРИЦЫ — упрощённый интерфейс
     ═══════════════════════════════════════════════════ */
  .mtx-empty {
    background: var(--bg-panel); border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 30px 20px;
    text-align: center; color: var(--text-mute);
    display: flex; flex-direction: column; gap: 12px; align-items: center;
  }
  .mtx-empty .icon { font-size: 40px; opacity: 0.4; }
  .mtx-empty .text { font-size: 14px; }
  .mtx-empty button {
    margin-top: 6px; padding: 12px 24px;
    background: linear-gradient(135deg, var(--accent), #3a7fe0);
    color: #fff; border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .mtx-pair {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .mtx-card {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow);
  }
  .mtx-card-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; font-weight: 700;
  }
  .mtx-card-head .name {
    color: var(--accent); font-size: 15px;
    background: rgba(91,157,255,0.12);
    padding: 2px 10px; border-radius: 20px;
  }
  .mtx-card-head .size { color: var(--text-mute); font-size: 11px; }
  .mtx-preview {
    background: #0b0d10; border-radius: 8px;
    padding: 8px; min-height: 56px;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 12px; color: #c8d0dc;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .mtx-preview .none { color: var(--text-mute); font-size: 12px; }
  .mtx-preview table { border-collapse: collapse; font-size: 12px; }
  .mtx-preview td { padding: 2px 6px; text-align: right; font-variant-numeric: tabular-nums; }
  .mtx-edit {
    padding: 8px; font-size: 12px; font-weight: 600;
    background: var(--bg-elev-2); color: var(--text);
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit;
  }

  .mtx-ops {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .mtx-ops-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-mute); font-weight: 700;
  }
  .mtx-ops-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .mtx-ops-row button {
    padding: 12px 4px; font-size: 13px; font-weight: 600;
    background: var(--bg-elev-2); color: var(--text);
    border: none; border-radius: 8px; cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s, filter 0.15s;
  }
  .mtx-ops-row button:active { transform: scale(0.96); }
  .mtx-ops-row button.primary {
    background: linear-gradient(135deg, var(--accent), #3a7fe0); color: #fff;
  }
  .mtx-ops-row button.success {
    background: linear-gradient(135deg, var(--success), #22a06b); color: #fff;
  }

  .mtx-result {
    background: var(--bg-panel); border: 1px solid var(--success);
    border-radius: var(--radius); padding: 14px 18px;
    font-family: 'SF Mono', 'Consolas', monospace;
    font-size: 14px; color: #fff;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 3px rgba(62,207,142,0.15);
  }
  .mtx-result .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--success); margin-bottom: 8px; font-weight: 700;
    font-family: inherit;
  }
  .mtx-result table { border-collapse: collapse; }
  .mtx-result td {
    padding: 4px 10px; text-align: right;
    border-right: 1px solid var(--border);
  }
  .mtx-result td:last-child { border-right: none; }
  .mtx-result .scalar {
    font-size: 22px; color: var(--success); font-weight: 700;
  }

  /* ═══════════════════════════════════════════════════
     КОНВЕРТЕР — упрощённый интерфейс
     ═══════════════════════════════════════════════════ */
  .conv-cats {
    display: flex; gap: 6px; overflow-x: auto; padding: 2px;
    scrollbar-width: none;
  }
  .conv-cats::-webkit-scrollbar { display: none; }
  .conv-cats button {
    flex: 0 0 auto; padding: 8px 14px;
    background: var(--bg-elev-2); color: var(--text-dim);
    border: none; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .conv-cats button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
  }
  .conv-body {
    background: var(--bg-panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: var(--shadow);
  }
  .conv-field {
    display: flex; flex-direction: column; gap: 4px;
  }
  .conv-field .lbl {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-mute); font-weight: 700;
  }
  .conv-input-row {
    display: flex; gap: 8px;
  }
  .conv-input-row input {
    flex: 1; background: #0b0d10; color: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 14px;
    font-size: 20px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .conv-input-row input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,157,255,0.15);
  }
  .conv-select {
    background: var(--bg-elev-2); color: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0 12px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    min-width: 110px; cursor: pointer;
  }
  .conv-arrow {
    text-align: center; font-size: 22px; color: var(--accent);
    margin: -4px 0;
  }
  .conv-result {
    background: #0b0d10; border-radius: var(--radius-sm);
    padding: 14px; display: flex; justify-content: space-between;
    align-items: center; gap: 8px;
  }
  .conv-result .val {
    font-size: 24px; font-weight: 700; color: var(--success);
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .conv-result .unit {
    font-size: 14px; color: var(--text-dim); font-weight: 600;
    flex: 0 0 auto;
  }

  /* ── Скроллбар ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Адаптив ── */
  @media (max-height: 700px) {
    #screen { font-size: 32px; }
    .display { min-height: 88px; padding: 14px 16px; }
    button.b { font-size: 15px; }
  }
  @media (max-width: 380px) {
    .tabs button { padding: 9px 6px; font-size: 12px; }
    #screen { font-size: 30px; }
    button.b { font-size: 14px; }
    .mtx-pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="tabs">
    <button data-tab="basic" class="active">Калькулятор</button>
    <button data-tab="frac">Дроби</button>
    <button data-tab="matrix">Матрицы</button>
    <button data-tab="convert">Конвертер</button>
  </div>

  <!-- ═══════ КАЛЬКУЛЯТОР ═══════ -->
  <div class="panel active" data-panel="basic">
    <div class="topbar">
      <span id="memLabel"></span>
      <span id="modeBtn">DEG</span>
    </div>
    <div class="display">
      <div id="screen">0</div>
      <div id="hint"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ═══════ ДРОБИ (переделан) ═══════ -->
  <div class="panel" data-panel="frac">
    <div class="frac-card">
      <div class="frac-row">
        <!-- Первая дробь -->
        <div class="frac-input">
          <input type="number" id="fA_num" value="1" placeholder="числитель">
          <div class="frac-line"></div>
          <input type="number" id="fA_den" value="2" placeholder="знаменатель">
        </div>

        <!-- Оператор -->
        <select id="fracOp" style="background:#0b0d10;color:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 8px;font-size:22px;font-weight:600;font-family:inherit;cursor:pointer;">
          <option value="+">+</option>
          <option value="-">−</option>
          <option value="*">×</option>
          <option value="/">÷</option>
        </select>

        <!-- Вторая дробь -->
        <div class="frac-input den">
          <input type="number" id="fB_num" value="1" placeholder="числитель">
          <div class="frac-line"></div>
          <input type="number" id="fB_den" value="3" placeholder="знаменатель">
        </div>
      </div>

      <div class="frac-actions">
        <button class="swap" id="fracSwap">↔ Поменять</button>
        <button class="equals" id="fracCalc">= Считать</button>
        <button class="clear" id="fracClear">Очистить</button>
      </div>

      <div class="frac-hint">
        Введите <b>числитель</b> (сверху) и <b>знаменатель</b> (снизу) для каждой дроби, выберите действие и нажмите <b>= Считать</b>.
      </div>
    </div>

    <div class="frac-output">
      <div class="frac-output-main" id="fracMain">—</div>
      <div class="frac-output-decimal" id="fracDecimal"></div>
    </div>
  </div>

  <!-- ═══════ МАТРИЦЫ (переделан) ═══════ -->
  <div class="panel" data-panel="matrix">
    <div id="matrixContent"></div>
  </div>

  <!-- ═══════ КОНВЕРТЕР (переделан) ═══════ -->
  <div class="panel" data-panel="convert">
    <div class="conv-cats" id="convCats"></div>

<script>
// ═══════════════════════════════════════════════════════
//  ЯДРО: ВЫЧИСЛИТЕЛЬ
// ═══════════════════════════════════════════════════════
const FUNCS = {
  sqrt: Math.sqrt, cbrt: Math.cbrt,
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  log: Math.log, log10: Math.log10, log2: Math.log2,
  abs: Math.abs, exp: Math.exp,
  floor: Math.floor, ceil: Math.ceil, round: Math.round,
  sign: Math.sign,
  mod: (a, b) => a % b,
};
const CONSTS = { pi: Math.PI, e: Math.E };
let degreesMode = true;

function preprocess(expr) {
  let s = expr
    .replace(/π/g, 'pi').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
    .replace(/√/g, '__sqrt__').replace(/∛/g, '__cbrt__');
  s = replaceRoots(s, '__sqrt__', 'sqrt');
  s = replaceRoots(s, '__cbrt__', 'cbrt');
  return s;
}
function replaceRoots(s, symbol, funcName) {
  let i = 0, out = '';
  while (i < s.length) {
    if (!s.startsWith(symbol, i)) { out += s[i]; i++; continue; }
    i += symbol.length;
    let sign = '';
    if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
    let arg = '';
    if (s[i] === '(') {
      let depth = 1, j = i + 1;
      while (j < s.length && depth > 0) {
        if (s[j] === '(') depth++;
        else if (s[j] === ')') depth--;
        j++;
      }
      arg = s.slice(i, j); i = j;
    } else if (s.startsWith('__sqrt__', i) || s.startsWith('__cbrt__', i)) {
      const [inner, ni] = readRootArg(s, i);
      arg = `(${inner})`; i = ni;
    } else if (/[0-9.]/.test(s[i])) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      arg = s.slice(i, j); i = j;
    } else if (/[a-zA-Zπ]/.test(s[i])) {
      let j = i;
      while (j < s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;
      arg = s.slice(i, j); i = j;
      if (s[i] === '(') {
        let depth = 1, k = i + 1;
        while (k < s.length && depth > 0) {
          if (s[k] === '(') depth++;
          else if (s[k] === ')') depth--;
          k++;
        }
        arg += s.slice(i, k); i = k;
      }
    }
    out += `${funcName}(${sign}${arg})`;
  }
  return out;
}
function readRootArg(s, i) {
  let sign = '';
  if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
  if (s.startsWith('__sqrt__', i) || s.startsWith('__cbrt__', i)) {
    const sym = s.startsWith('__sqrt__', i) ? '__sqrt__' : '__cbrt__';
    const fn  = sym === '__sqrt__' ? 'sqrt' : 'cbrt';
    const [inner, ni] = readRootArg(s, i + sym.length);
    return [`${fn}(${inner})`, ni];
  }
  if (s[i] === '(') {
    let depth = 1, j = i + 1;
    while (j < s.length && depth > 0) {
      if (s[j] === '(') depth++;
      else if (s[j] === ')') depth--;
      j++;
    }
    return [s.slice(i, j), j];
  }
  if (/[0-9.]/.test(s[i])) {
    let j = i;
    while (j < s.length && /[0-9.]/.test(s[j])) j++;
    return [s.slice(i, j), j];
  }
  let j = i;
  while (j < s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;
  return [s.slice(i, j), j];
}
function tokenize(s) {
  const tokens = []; let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      tokens.push({ type: 'num', value: parseFloat(s.slice(i, j)) });
      i = j; continue;
    }
    if (/[a-zA-Z_]/.test(ch)) {
      let j = i;
      while (j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;
      tokens.push({ type: 'name', value: s.slice(i, j) });
      i = j; continue;
    }
    if ('+-*/%^(),'.includes(ch)) {
      tokens.push({ type: 'op', value: ch }); i++; continue;
    }
    throw new Error('Недопустимый символ: ' + ch);
  }
  return tokens;
}
function parse(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const expect = (val) => {
    const t = next();
    if (!t || t.value !== val) throw new Error('Ожидалось: ' + val);
    return t;
  };
  function parseExpr() { return parseAddSub(); }
  function parseAddSub() {
    let left = parseMulDiv();
    while (peek() && (peek().value === '+' || peek().value === '-')) {
      const op = next().value; const right = parseMulDiv();
      if (op === '+' && right && right.__isPct) left = left + left * right.value / 100;
      else if (op === '-' && right && right.__isPct) left = left - left * right.value / 100;
      else if (op === '+') left = left + right;
      else left = left - right;
    }
    return left;
  }
  function parseMulDiv() {
    let left = parseUnary();
    while (peek() && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
      const op = next().value; const right = parseUnary();
      if (op === '*') {
        if (right && right.__isPct) left = left * right.value / 100;
        else left = left * right;
      } else if (op === '/') {
        const d = (right && right.__isPct) ? right.value / 100 : right;
        if (d === 0) throw new Error('На ноль делить нельзя');
        left = left / d;
      } else {
        const d = (right && right.__isPct) ? right.value / 100 : right;
        if (d === 0) throw new Error('На ноль делить нельзя');
        left = left % d;
      }
    }
    return left;
  }
  function parseUnary() {
    if (peek() && peek().value === '-') { next(); return -parseUnary(); }
    if (peek() && peek().value === '+') { next(); return parseUnary(); }
    return parsePower();
  }
  function parsePower() {
    const base = parseAtom();
    if (peek() && peek().value === '^') {
      next(); const exp = parseUnary();
      return Math.pow(base, exp);
    }
    return base;
  }
  function parseAtom() {
    const t = next();
    if (!t) throw new Error('Неожиданный конец');
    if (t.type === 'num') {
      if (peek() && peek().value === '%') { next(); return { __isPct: true, value: t.value }; }
      return t.value;
    }
    if (t.type === 'name') {
      if (t.value in CONSTS) {
        let v = CONSTS[t.value];
        if (peek() && peek().value === '%') { next(); return { __isPct: true, value: v }; }
        return v;
      }
      if (t.value in FUNCS) {
        expect('(');
        let arg = parseExpr();
        expect(')');
        if (arg && arg.__isPct) arg = arg.value;
        const fn = FUNCS[t.value];
        if (degreesMode && ['sin','cos','tan'].includes(t.value)) arg = arg * Math.PI / 180;
        let res = fn(arg);
        if (degreesMode && ['asin','acos','atan'].includes(t.value)) res = res * 180 / Math.PI;
        if (peek() && peek().value === '%') { next(); return { __isPct: true, value: res }; }
        return res;
      }
      throw new Error('Неизвестное имя: ' + t.value);
    }
    if (t.value === '(') {
      const val = parseExpr();
      expect(')');
      if (peek() && peek().value === '%') { next(); return { __isPct: true, value: val }; }
      return val;
    }
    throw new Error('Неожиданный токен: ' + t.value);
  }
  const result = parseExpr();
  if (pos < tokens.length) throw new Error('Лишний токен: ' + tokens[pos].value);
  if (result && result.__isPct) return result.value / 100;
  return result;
}
FUNCS.factorial = (n) => {
  if (n < 0 || !Number.isInteger(n)) throw new Error('Факториал только для целых ≥ 0');
  if (n > 170) throw new Error('Слишком большое число');
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
};
function safeEval(expr) { return parse(tokenize(preprocess(expr))); }
function fmt(v) {
  if (typeof v === 'number') {
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return String(v);
    return String(parseFloat(v.toPrecision(12)));
  }
  return String(v);
}

// ═══════════════════════════════════════════════════════
//  ВКЛАДКИ
// ═══════════════════════════════════════════════════════
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
  });
});

// ═══════════════════════════════════════════════════════
//  КАЛЬКУЛЯТОР
// ═══════════════════════════════════════════════════════
let expression = '';
let resultShown = false;
let memory = 0;
let history = [];

const screenEl = document.getElementById('screen');
const hintEl   = document.getElementById('hint');
const memEl    = document.getElementById('memLabel');
const modeEl   = document.getElementById('modeBtn');
const gridEl   = document.getElementById('grid');

function updateScreen() { screenEl.textContent = expression || '0'; }
function insert(text) {
  if (resultShown) {
    if (/^[0-9.(a-zA-Z√∛π]/.test(text)) expression = '';
    resultShown = false;
  }
  if (expression.length + text.length > 120) return;
  expression += text; updateScreen();
}
function onClear() { expression = ''; resultShown = false; hintEl.textContent = ''; updateScreen(); }
function onBackspace() { expression = expression.slice(0, -1); resultShown = false; updateScreen(); }
function onNegate() {
  if (!expression) expression = '-';
  else if (expression.startsWith('-')) expression = expression.slice(1);
  else expression = '-' + expression;
  updateScreen();
}
function onFactorial() {
  if (resultShown) resultShown = false;
  expression = expression ? `fact(${expression})` : 'fact(';
  updateScreen();
}
function onInverse() {
  if (!expression) return;
  resultShown = false; expression = `1/(${expression})`; updateScreen();
}
function onEquals() {
  if (!expression) return;
  try {
    const open = (expression.match(/\(/g) || []).length;
    const close = (expression.match(/\)/g) || []).length;
    let expr = expression + ')'.repeat(Math.max(0, open - close));
    expr = expr.replace(/fact\(/g, 'factorial(');
    const result = safeEval(expr);
    if (typeof result !== 'number' || Number.isNaN(result) || !Number.isFinite(result)) {
      throw new Error('Результат не определён');
    }
    hintEl.textContent = expression + ' =';
    history.push([expression, fmt(result)]);
    expression = fmt(result);
    resultShown = true; updateScreen();
  } catch (e) {
    hintEl.textContent = '⚠ ' + e.message;
    expression = ''; resultShown = false; updateScreen();
  }
}
function toggleDegrees() {
  degreesMode = !degreesMode;
  modeEl.textContent = degreesMode ? 'DEG' : 'RAD';
}
function memUpdate() { memEl.textContent = memory ? 'M · ' + fmt(memory) : ''; }
function memClear()  { memory = 0; memUpdate(); }
function memRecall() { if (resultShown) resultShown = false; expression += fmt(memory); updateScreen(); }
function memAdd()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory += v; memUpdate(); } catch(e){} }
function memSub()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory -= v; memUpdate(); } catch(e){} }
function showHistory() {
  const hl = document.getElementById('historyList');
  hl.innerHTML = history.length
    ? history.map(([e, r]) => `<div>${e} <span style="color:var(--success)">= ${r}</span></div>`).join('')
    : '<div class="empty">История пуста</div>';
  document.getElementById('historyModal').classList.add('open');
}

const BUTTONS = [
  ['MC','gray',memClear],['MR','gray',memRecall],['M+','gray',memAdd],['M-','gray',memSub],['C','red',onClear],
  ['sin','fn',()=>insert('sin(')],['cos','fn',()=>insert('cos(')],['tan','fn',()=>insert('tan(')],['⌫','ctrl',onBackspace],['(','ctrl',()=>insert('(')],
  ['√','fn',()=>insert('√')],['∛','fn',()=>insert('∛')],['x²','fn',()=>insert('^2')],['xʸ','fn',()=>insert('^')],['%','fn',()=>insert('%')],
  ['log','fn',()=>insert('log10(')],['ln','fn',()=>insert('log(')],['n!','fn',onFactorial],['π','fn',()=>insert('π')],[')','ctrl',()=>insert(')')],
  ['7','num',()=>insert('7')],['8','num',()=>insert('8')],['9','num',()=>insert('9')],['÷','op',()=>insert('/')],['e','fn',()=>insert('e')],
  ['4','num',()=>insert('4')],['5','num',()=>insert('5')],['6','num',()=>insert('6')],['×','op',()=>insert('*')],['1/x','fn',onInverse],
  ['1','num',()=>insert('1')],['2','num',()=>insert('2')],['3','num',()=>insert('3')],['−','op',()=>insert('-')],['=','green',onEquals],
  ['0','num',()=>insert('0')],['.','num',()=>insert('.')],['±','num',onNegate],['+','op',()=>insert('+')],['Hist','teal',showHistory],
];
BUTTONS.forEach(([label, cls, fn]) => {
  const b = document.createElement('button');
  b.textContent = label; b.className = 'b ' + cls;
  b.addEventListener('click', fn);
  gridEl.appendChild(b);
});
modeEl.addEventListener('click', toggleDegrees);
document.getElementById('closeHist').addEventListener('click', () =>
  document.getElementById('historyModal').classList.remove('open'));

// ═══════════════════════════════════════════════════════
//  ДРОБИ — простой интерфейс
// ═══════════════════════════════════════════════════════
function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function simplify(n, d) {
  if (d === 0) return { n: 0, d: 0 };
  const s = n * d < 0 ? -1 : 1;
  const g = gcd(Math.abs(n), Math.abs(d));
  return { n: s * Math.abs(n) / g, d: Math.abs(d) / g };
}

function renderFracResult(result, decimal) {
  const main = document.getElementById('fracMain');
  const dec  = document.getElementById('fracDecimal');
  if (!result) { main.textContent = '—'; dec.textContent = ''; return; }
  if (result.d === 0) {
    main.innerHTML = '<span style="color:var(--danger)">∞</span>';
    dec.textContent = 'деление на ноль';
    return;
  }
  if (result.d === 1) {
    main.textContent = result.n;
  } else {
    main.innerHTML = `<span class="frac-inline"><span class="n">${result.n}</span><span class="d">${result.d}</span></span>`;
  }
  dec.textContent = decimal !== undefined ? `≈ ${decimal}` : '';
}

document.getElementById('fracCalc').addEventListener('click', () => {
  const aN = parseInt(document.getElementById('fA_num').value) || 0;
  const aD = parseInt(document.getElementById('fA_den').value) || 1;
  const bN = parseInt(document.getElementById('fB_num').value) || 0;
  const bD = parseInt(document.getElementById('fB_den').value) || 1;
  const op = document.getElementById('fracOp').value;

  if (aD === 0 || bD === 0) {
    renderFracResult(null);
    document.getElementById('fracDecimal').textContent = '⚠ Знаменатель не может быть 0';
    return;
  }

  let n, d;
  if (op === '+') { n = aN * bD + bN * aD; d = aD * bD; }
  else if (op === '-') { n = aN * bD - bN * aD; d = aD * bD; }
  else if (op === '*') { n = aN * bN; d = aD * bD; }
  else if (op === '/') {
    if (bN === 0) {
      renderFracResult(null);
      document.getElementById('fracDecimal').textContent = '⚠ На ноль делить нельзя';
      return;
    }
    n = aN * bD; d = aD * bN;
  }
  const r = simplify(n, d);
  const decimal = (r.n / r.d).toFixed(6).replace(/\.?0+$/, '');
  renderFracResult(r, decimal);
});

document.getElementById('fracClear').addEventListener('click', () => {
  document.getElementById('fA_num').value = '';
  document.getElementById('fA_den').value = '';
  document.getElementById('fB_num').value = '';
  document.getElementById('fB_den').value = '';
  document.getElementById('fracOp').value = '+';
  renderFracResult(null);
});

document.getElementById('fracSwap').addEventListener('click', () => {
  // поменять местами A и B
  const aN = document.getElementById('fA_num').value;
  const aD = document.getElementById('fA_den').value;
  document.getElementById('fA_num').value = document.getElementById('fB_num').value;
  document.getElementById('fA_den').value = document.getElementById('fB_den').value;
  document.getElementById('fB_num').value = aN;
  document.getElementById('fB_den').value = aD;
});

// ═══════════════════════════════════════════════════════
//  МАТРИЦЫ — простой интерфейс
// ═══════════════════════════════════════════════════════
let matrixA = null;
let matrixB = null;
let matrixResult = null;

function renderMatrixPreview(m, label) {
  if (!m) return `<span class="none">не задана</span>`;
  let html = '<table>';
  for (let i = 0; i < m.rows; i++) {
    html += '<tr>';
    for (let j = 0; j < m.cols; j++) {
      html += `<td>${fmt(m.data[i][j])}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  return html;
}

function renderMatrixResult(r) {
  if (!r) return '';
  if (typeof r === 'number') {
    return `<div class="mtx-result"><div class="label">Результат</div><div class="scalar">${fmt(r)}</div></div>`;
  }
  return `<div class="mtx-result"><div class="label">Результат (${r.rows}×${r.cols})</div>${renderMatrixPreview(r)}</div>`;
}

function renderMatrixPanel() {
  const el = document.getElementById('matrixContent');
  const hasA = !!matrixA;
  const hasB = !!matrixB;

  if (!hasA && !hasB) {
    el.innerHTML = `
      <div class="mtx-empty">
        <div class="icon">▦</div>
        <div class="text">Матрицы не заданы.<br>Начните с создания матрицы A.</div>
        <button id="mtxCreateA">Создать матрицу A</button>
      </div>
    `;
    document.getElementById('mtxCreateA').addEventListener('click', () => openMatrixModal('A'));
    return;
  }

  el.innerHTML = `
    <div class="mtx-pair">
      <div class="mtx-card">
        <div class="mtx-card-head">
          <span class="name">A</span>
          <span class="size">${matrixA ? matrixA.rows + '×' + matrixA.cols : ''}</span>
        </div>
        <div class="mtx-preview">${renderMatrixPreview(matrixA)}</div>
        <button class="mtx-edit" data-target="A">${matrixA ? 'Изменить' : 'Создать'}</button>
      </div>
      <div class="mtx-card">
        <div class="mtx-card-head">
          <span class="name">B</span>
          <span class="size">${matrixB ? matrixB.rows + '×' + matrixB.cols : ''}</span>
        </div>
        <div class="mtx-preview">${renderMatrixPreview(matrixB)}</div>
        <button class="mtx-edit" data-target="B">${matrixB ? 'Изменить' : 'Создать'}</button>
      </div>
    </div>

    ${matrixA ? `
      <div class="mtx-ops">
        <div class="mtx-ops-title">С матрицей A</div>
        <div class="mtx-ops-row">
          <button data-op="transpose">Транспонировать</button>
          <button data-op="det">Определитель</button>
          <button data-op="trace">След</button>
          <button data-op="scale">Умножить на k</button>
        </div>
      </div>
    ` : ''}

    ${matrixA && matrixB ? `
      <div class="mtx-ops">
        <div class="mtx-ops-title">С двумя матрицами</div>
        <div class="mtx-ops-row">
          <button class="success" data-op="add">A + B</button>
          <button class="success" data-op="sub">A − B</button>
          <button class="success" data-op="mul">A × B</button>
        </div>
      </div>
    ` : ''}

    ${matrixResult ? renderMatrixResult(matrixResult) : ''}

    <div class="mtx-ops">
      <div class="mtx-ops-row">
        <button data-op="identity" style="grid-column: span 2;">Единичная E(n)</button>
        <button data-op="clearresult" style="grid-column: span 2;">Сбросить результат</button>
      </div>
    </div>
  `;

  el.querySelectorAll('[data-target]').forEach(b => b.addEventListener('click', () => openMatrixModal(b.dataset.target)));
  el.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => handleMatrixOp(b.dataset.op)));
}

function handleMatrixOp(op) {
  try {
    if (op === 'transpose') matrixResult = matrixTranspose(matrixA);
    else if (op === 'det') matrixResult = matrixDeterminant(matrixA);
    else if (op === 'trace') matrixResult = matrixTrace(matrixA);
    else if (op === 'scale') {
      const k = parseFloat(prompt('На какое число умножить матрицу A?', '2'));
      if (isNaN(k)) return;
      matrixResult = matrixScale(matrixA, k);
    }
    else if (op === 'add') matrixResult = matrixAdd(matrixA, matrixB);
    else if (op === 'sub') matrixResult = matrixSub(matrixA, matrixB);
    else if (op === 'mul') matrixResult = matrixMul(matrixA, matrixB);
    else if (op === 'identity') {
      const n = parseInt(prompt('Размер единичной матрицы (n×n):', '3'));
      if (!n || n < 1 || n > 6) return;
      matrixResult = matrixIdentity(n);
    }
    else if (op === 'clearresult') matrixResult = null;
    renderMatrixPanel();
  } catch (e) {
    alert('Ошибка: ' + e.message);
  }
}

function matrixAdd(a, b) {
  if (a.rows !== b.rows || a.cols !== b.cols) throw new Error('Размеры A и B должны совпадать');
  return { rows: a.rows, cols: a.cols, data: a.data.map((r, i) => r.map((v, j) => v + b.data[i][j])) };
}
function matrixSub(a, b) {
  if (a.rows !== b.rows || a.cols !== b.cols) throw new Error('Размеры A и B должны совпадать');
  return { rows: a.rows, cols: a.cols, data: a.data.map((r, i) => r.map((v, j) => v - b.data[i][j])) };
}
function matrixMul(a, b) {
  if (a.cols !== b.rows) throw new Error('Число столбцов A должно равняться числу строк B');
  const r = Array.from({length: a.rows}, () => Array(b.cols).fill(0));
  for (let i = 0; i < a.rows; i++)
    for (let j = 0; j < b.cols; j++)
      for (let k = 0; k < a.cols; k++)
        r[i][j] += a.data[i][k] * b.data[k][j];
  return { rows: a.rows, cols: b.cols, data: r };
}
function matrixTranspose(a) {
  return { rows: a.cols, cols: a.rows, data: Array.from({length: a.cols}, (_, i) => a.data.map(r => r[i])) };
}
function matrixDeterminant(a) {
  if (a.rows !== a.cols) throw new Error('Определитель есть только у квадратной матрицы');
  const n = a.rows;
  const m = a.data.map(r => [...r]);
  let det = 1;
  for (let i = 0; i < n; i++) {
    let pivot = i;
    for (let j = i + 1; j < n; j++) if (Math.abs(m[j][i]) > Math.abs(m[pivot][i])) pivot = j;
    if (Math.abs(m[pivot][i]) < 1e-12) return 0;
    if (pivot !== i) { [m[i], m[pivot]] = [m[pivot], m[i]]; det = -det; }
    det *= m[i][i];
    for (let j = i + 1; j < n; j++) {
      const f = m[j][i] / m[i][i];
      for (let k = i; k < n; k++) m[j][k] -= f * m[i][k];
    }
  }
  return det;
}
function matrixTrace(a) {
  if (a.rows !== a.cols) throw new Error('След есть только у квадратной матрицы');
  let s = 0;
  for (let i = 0; i < a.rows; i++) s += a.data[i][i];
  return s;
}
function matrixScale(a, k) {
  return { rows: a.rows, cols: a.cols, data: a.data.map(r => r.map(v => v * k)) };
}
function matrixIdentity(n) {
  return { rows: n, cols: n, data: Array.from({length: n}, (_, i) => Array.from({length: n}, (_, j) => i === j ? 1 : 0)) };
}

const matrixModal = document.getElementById('matrixModal');
const matrixInputsEl = document.getElementById('matrixInputs');
const mRowsEl = document.getElementById('mRows');
const mColsEl = document.getElementById('mCols');
let matrixModalTarget = 'A';

function buildMatrixInputs(presetData) {
  const r = Math.max(1, Math.min(6, parseInt(mRowsEl.value) || 2));
  const c = Math.max(1, Math.min(6, parseInt(mColsEl.value) || 2));
  matrixInputsEl.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
  matrixInputsEl.innerHTML = '';
  for (let i = 0; i < r; i++)
    for (let j = 0; j < c; j++) {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.dataset.i = i; inp.dataset.j = j;
      inp.style.textAlign = 'center';
      inp.style.padding = '10px 4px';
      inp.style.fontSize = '15px';
      inp.value = presetData && presetData[i] && presetData[i][j] !== undefined ? presetData[i][j] : 0;
      matrixInputsEl.appendChild(inp);
    }
}
mRowsEl.addEventListener('input', () => buildMatrixInputs());
mColsEl.addEventListener('input', () => buildMatrixInputs());

function openMatrixModal(target) {
  matrixModalTarget = target;
  const existing = target === 'A' ? matrixA : matrixB;
  document.getElementById('matrixModalTitle').textContent = existing ? 'Изменить матрицу ' + target : 'Создать матрицу ' + target;
  if (existing) {
    mRowsEl.value = existing.rows;
    mColsEl.value = existing.cols;
    buildMatrixInputs(existing.data);
  } else {
    mRowsEl.value = 2; mColsEl.value = 2;
    buildMatrixInputs();
  }
  matrixModal.classList.add('open');
}

document.getElementById('saveMatrix').addEventListener('click', () => {
  const r = parseInt(mRowsEl.value) || 2;
  const c = parseInt(mColsEl.value) || 2;
  const data = Array.from({length: r}, () => Array(c).fill(0));
  matrixInputsEl.querySelectorAll('input').forEach(inp => {
    data[+inp.dataset.i][+inp.dataset.j] = parseFloat(inp.value) || 0;
  });
  const m = { rows: r, cols: c, data };
  if (matrixModalTarget === 'A') matrixA = m;
  else matrixB = m;
  matrixResult = null;
  matrixModal.classList.remove('open');
  renderMatrixPanel();
});

document.getElementById('cancelMatrix').addEventListener('click', () => matrixModal.classList.remove('open'));

renderMatrixPanel();

// ═══════════════════════════════════════════════════════
//  КОНВЕРТЕР — простой интерфейс
// ═══════════════════════════════════════════════════════
const CONV_CATEGORIES = {
  'Температура': {
    units: ['°C', '°F', 'K'],
    convert: (v, from, to) => {
      // сначала в °C
      let c;
      if (from === '°C') c = v;
      else if (from === '°F') c = (v - 32) * 5/9;
      else c = v - 273.15;
      // потом из °C
      if (to === '°C') return c;
      if (to === '°F') return c * 9/5 + 32;
      return c + 273.15;
    }
  },
  'Длина': {
    units: ['м', 'см', 'км', 'фут', 'дюйм', 'миля'],
    convert: (v, from, to) => {
      const toM = { 'м': 1, 'см': 0.01, 'км': 1000, 'фут': 0.3048, 'дюйм': 0.0254, 'миля': 1609.344 };
      return v * toM[from] / toM[to];
    }
  },
  'Масса': {
    units: ['кг', 'г', 'мг', 'фунт', 'унция'],
    convert: (v, from, to) => {
      const toKg = { 'кг': 1, 'г': 0.001, 'мг': 0.000001, 'фунт': 0.453592, 'унция': 0.0283495 };
      return v * toKg[from] / toKg[to];
    }
  },
  'Углы': {
    units: ['град', 'рад'],
    convert: (v, from, to) => {
      if (from === to) return v;
      if (from === 'град') return v * Math.PI / 180;
      return v * 180 / Math.PI;
    }
  },
  'Площадь': {
    units: ['м²', 'см²', 'км²', 'га', 'акр'],
    convert: (v, from, to) => {
      const toM2 = { 'м²': 1, 'см²': 0.0001, 'км²': 1e6, 'га': 10000, 'акр': 4046.86 };
      return v * toM2[from] / toM2[to];
    }
  },
};

let convCategory = 'Температура';

function renderConvCategories() {
  const el = document.getElementById('convCats');
  el.innerHTML = '';
  Object.keys(CONV_CATEGORIES).forEach(cat => {
    const b = document.createElement('button');
    b.textContent = cat;
    if (cat === convCategory) b.classList.add('active');
    b.addEventListener('click', () => {
      convCategory = cat;
      renderConvCategories();
      renderConvUnits();
      convertNow();
    });
    el.appendChild(b);
  });
}

function renderConvUnits() {
  const units = CONV_CATEGORIES[convCategory].units;
  const fromSel = document.getElementById('convFrom');
  const toSel   = document.getElementById('convTo');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  units.forEach(u => {
    const o1 = document.createElement('option'); o1.value = u; o1.textContent = u; fromSel.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = u; o2.textContent = u; toSel.appendChild(o2);
  });
  fromSel.value = units[0];
  toSel.value = units[1] || units[0];
}

function convertNow() {
  const v = parseFloat(document.getElementById('convInput').value) || 0;
  const from = document.getElementById('convFrom').value;
  const to = document.getElementById('convTo').value;
  const r = CONV_CATEGORIES[convCategory].convert(v, from, to);
  document.getElementById('convResult').textContent = fmt(r);
  document.getElementById('convResultUnit').textContent = to;
}

document.getElementById('convInput').addEventListener('input', convertNow);
document.getElementById('convFrom').addEventListener('change', convertNow);
document.getElementById('convTo').addEventListener('change', convertNow);

renderConvCategories();
renderConvUnits();
convertNow();

// ═══════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ═══════════════════════════════════════════════════════
updateScreen();
memUpdate();
</script>
