<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<title>Калькулятор Pro — для студентов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: #14161a; color: #fff;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: 6px; gap: 4px;
    max-width: 560px; margin: 0 auto;
  }

  /* ── Вкладки ── */
  .tabs {
    display: flex; gap: 4px;
    background: #0f1216; border-radius: 10px; padding: 4px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; background: transparent; color: #aaa;
    padding: 8px 12px; font-size: 13px; font-weight: bold;
    border-radius: 8px; border: none; cursor: pointer;
    white-space: nowrap;
  }
  .tabs button.active { background: #2980b9; color: #fff; }

  /* ── Панели ── */
  .panel { display: none; flex: 1; flex-direction: column; gap: 4px; min-height: 0; }
  .panel.active { display: flex; }

  /* ── Верхняя строка (M / DEG) ── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2px 10px; font-size: 12px; font-weight: bold; min-height: 18px;
  }
  #memLabel { color: #f1c40f; }
  #modeBtn  { color: #3498db; cursor: pointer; padding: 2px 8px; }

  /* ── Дисплей ── */
  .display {
    background: #0b0d10; border-radius: 12px;
    padding: 12px 16px; text-align: right;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 86px;
  }
  #screen {
    font-size: 30px; font-weight: bold;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.2;
  }
  #hint {
    font-size: 12px; color: #888; min-height: 15px;
    margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* ── Сетка кнопок ── */
  .grid {
    flex: 1; display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 1fr;
    gap: 4px;
  }
  .grid.matrix-grid {
    grid-template-columns: repeat(4, 1fr);
  }
  button.b {
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: bold; color: #fff;
    font-family: inherit; cursor: pointer;
    transition: filter 0.1s; padding: 0;
    min-height: 0;
  }
  button.b:active { filter: brightness(1.25); }
  .num   { background: #2c3e50; }
  .op    { background: #e67e22; }
  .fn    { background: #8e44ad; }
  .ctrl  { background: #34495e; }
  .gray  { background: #7f8c8d; }
  .red   { background: #c0392b; }
  .green { background: #27ae60; }
  .teal  { background: #16a085; }
  .blue  { background: #2980b9; }
  .fr    { background: #16a085; } /* дроби */

  /* ── Модалка ── */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100;
    justify-content: center; align-items: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #1e2128; border-radius: 14px;
    width: 100%; max-width: 440px; max-height: 85vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-box h3 { padding: 14px 18px; border-bottom: 1px solid #333; font-size: 16px; }
  .modal-content {
    flex: 1; overflow-y: auto; padding: 12px 18px;
    font-family: 'Consolas', monospace; font-size: 13px;
    line-height: 1.7; color: #ddd;
  }
  .modal-content .empty { color: #666; }
  .modal-content input, .modal-content select {
    background: #14161a; color: #fff; border: 1px solid #333;
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
    width: 100%; margin: 4px 0; font-family: inherit;
  }
  .modal-content label { display: block; color: #aaa; font-size: 12px; margin-top: 6px; }
  .modal-btn {
    background: #2980b9; border: none; border-radius: 0;
    padding: 12px; font-size: 14px; font-weight: bold; color: #fff;
    cursor: pointer; width: 100%;
  }
  .modal-btn.red { background: #c0392b; }
  .matrix-input {
    display: grid; gap: 4px; margin-top: 6px;
  }
  .matrix-input input {
    text-align: center; padding: 6px;
  }

  /* ── Матрицы ── */
  #matrixView {
    background: #0b0d10; border-radius: 12px;
    padding: 10px; font-family: 'Consolas', monospace;
    font-size: 14px; overflow: auto; max-height: 220px;
    white-space: pre-wrap; line-height: 1.5;
    min-height: 80px;
  }
  .matrix-actions {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 4px; margin-top: 4px;
  }
  .matrix-actions button {
    padding: 10px 4px; font-size: 13px;
  }

  /* ── Дроби ── */
  .frac-display {
    background: #0b0d10; border-radius: 12px;
    padding: 14px; text-align: center;
    font-family: 'Consolas', monospace; font-size: 18px;
    min-height: 70px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }
  .frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; }
  .frac .num { border-bottom: 2px solid #fff; padding: 0 6px; }
  .frac .den { padding: 0 6px; }
  .frac-result { color: #27ae60; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div id="app">

  <!-- ── Вкладки ── -->
  <div class="tabs">
    <button data-tab="basic" class="active">Калькулятор</button>
    <button data-tab="frac">Дроби</button>
    <button data-tab="matrix">Матрицы</button>
    <button data-tab="convert">Конвертер</button>
  </div>

  <!-- ═══════════════ ВКЛАДКА: КАЛЬКУЛЯТОР ═══════════════ -->
  <div class="panel active" data-panel="basic">
    <div class="topbar">
      <span id="memLabel"></span>
      <span id="modeBtn">DEG</span>
    </div>
    <div class="display">
      <div id="screen">0</div>
      <div id="hint"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- ═══════════════ ВКЛАДКА: ДРОБИ ═══════════════ -->
  <div class="panel" data-panel="frac">
    <div class="frac-display">
      <div id="fracView">
        <div class="frac"><span class="num" id="fNum">0</span><span class="den" id="fDen">1</span></div>
      </div>
      <div class="frac-result" id="fracResult"></div>
    </div>
    <div class="grid" id="fracGrid"></div>
  </div>

  <!-- ═══════════════ ВКЛАДКА: МАТРИЦЫ ═══════════════ -->
  <div class="panel" data-panel="matrix">
    <div id="matrixView">Матрица не задана. Нажмите «Создать».</div>
    <div class="matrix-actions" id="matrixActions"></div>
    <div class="grid matrix-grid" id="matrixGrid"></div>
  </div>

  <!-- ═══════════════ ВКЛАДКА: КОНВЕРТЕР ═══════════════ -->
  <div class="panel" data-panel="convert">
    <div class="display">
      <div id="convScreen" style="font-size:22px;">0</div>
      <div id="convHint" style="font-size:12px;color:#888;min-height:15px;"></div>
    </div>
    <div class="grid" id="convGrid"></div>
  </div>

</div>

<!-- ── Модалка истории ── -->
<div class="modal" id="historyModal">
  <div class="modal-box">
    <h3>История</h3>
    <div class="modal-content" id="historyList"></div>
    <button class="modal-btn red" id="closeHist">Закрыть</button>
  </div>
</div>

<!-- ── Модалка матрицы ── -->
<div class="modal" id="matrixModal">
  <div class="modal-box">
    <h3>Создать матрицу</h3>
    <div class="modal-content">
      <label>Строк:</label>
      <input type="number" id="mRows" value="2" min="1" max="6">
      <label>Столбцов:</label>
      <input type="number" id="mCols" value="2" min="1" max="6">
      <div id="matrixInputs" class="matrix-input"></div>
    </div>
    <button class="modal-btn" id="saveMatrix">Сохранить</button>
    <button class="modal-btn red" id="cancelMatrix">Отмена</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  ЯДРО: ВЫЧИСЛИТЕЛЬ
// ═══════════════════════════════════════════════════════

const FUNCS = {
  sqrt: Math.sqrt, cbrt: Math.cbrt,
  sin: Math.sin, cos: Math.cos, tan: Math.tan,
  asin: Math.asin, acos: Math.acos, atan: Math.atan,
  sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
  log: Math.log, log10: Math.log10, log2: Math.log2,
  abs: Math.abs, exp: Math.exp,
  floor: Math.floor, ceil: Math.ceil, round: Math.round,
  sign: Math.sign,
  mod: (a, b) => a % b,
};
const CONSTS = { pi: Math.PI, e: Math.E };

let degreesMode = true;

// ─── Препроцессинг ───────────────────────────────────────
function preprocess(expr) {
  let s = expr
    .replace(/π/g, 'pi')
    .replace(/×/g, '*')
    .replace(/÷/g, '/')
    .replace(/−/g, '-')
    .replace(/√/g, '__sqrt__')
    .replace(/∛/g, '__cbrt__');

  s = replaceRoots(s, '__sqrt__', 'sqrt');
  s = replaceRoots(s, '__cbrt__', 'cbrt');
  return s;
}

function replaceRoots(s, symbol, funcName) {
  let i = 0, out = '';
  while (i < s.length) {
    if (!s.startsWith(symbol, i)) { out += s[i]; i++; continue; }
    i += symbol.length;
    let sign = '';
    if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
    let arg = '';
    if (s[i] === '(') {
      let depth = 1, j = i + 1;
      while (j < s.length && depth > 0) {
        if (s[j] === '(') depth++;
        else if (s[j] === ')') depth--;
        j++;
      }
      arg = s.slice(i, j); i = j;
    } else if (s.startsWith('__sqrt__', i) || s.startsWith('__cbrt__', i)) {
      const [inner, ni] = readRootArg(s, i);
      arg = `(${inner})`; i = ni;
    } else if (/[0-9.]/.test(s[i])) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      arg = s.slice(i, j); i = j;
    } else if (/[a-zA-Zπ]/.test(s[i])) {
      let j = i;
      while (j < s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;
      arg = s.slice(i, j); i = j;
      if (s[i] === '(') {
        let depth = 1, k = i + 1;
        while (k < s.length && depth > 0) {
          if (s[k] === '(') depth++;
          else if (s[k] === ')') depth--;
          k++;
        }
        arg += s.slice(i, k); i = k;
      }
    }
    out += `${funcName}(${sign}${arg})`;
  }
  return out;
}

function readRootArg(s, i) {
  let sign = '';
  if (s[i] === '+' || s[i] === '-') { sign = s[i]; i++; }
  if (s.startsWith('__sqrt__', i) || s.startsWith('__cbrt__', i)) {
    const sym = s.startsWith('__sqrt__', i) ? '__sqrt__' : '__cbrt__';
    const fn  = sym === '__sqrt__' ? 'sqrt' : 'cbrt';
    const [inner, ni] = readRootArg(s, i + sym.length);
    return [`${fn}(${inner})`, ni];
  }
  if (s[i] === '(') {
    let depth = 1, j = i + 1;
    while (j < s.length && depth > 0) {
      if (s[j] === '(') depth++;
      else if (s[j] === ')') depth--;
      j++;
    }
    return [s.slice(i, j), j];
  }
  if (/[0-9.]/.test(s[i])) {
    let j = i;
    while (j < s.length && /[0-9.]/.test(s[j])) j++;
    return [s.slice(i, j), j];
  }
  let j = i;
  while (j < s.length && /[a-zA-Z0-9_π]/.test(s[j])) j++;
  return [s.slice(i, j), j];
}

// ─── Токенизатор ─────────────────────────────────────────
function tokenize(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i;
      while (j < s.length && /[0-9.]/.test(s[j])) j++;
      tokens.push({ type: 'num', value: parseFloat(s.slice(i, j)) });
      i = j; continue;
    }
    if (/[a-zA-Z_]/.test(ch)) {
      let j = i;
      while (j < s.length && /[a-zA-Z0-9_]/.test(s[j])) j++;
      tokens.push({ type: 'name', value: s.slice(i, j) });
      i = j; continue;
    }
    if ('+-*/%^(),'.includes(ch)) {
      tokens.push({ type: 'op', value: ch });
      i++; continue;
    }
    throw new Error('Недопустимый символ: ' + ch);
  }
  return tokens;
}

// ─── Парсер ──────────────────────────────────────────────
function parse(tokens) {
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  const expect = (val) => {
    const t = next();
    if (!t || t.value !== val) throw new Error('Ожидалось: ' + val);
    return t;
  };

  function parseExpr() { return parseAddSub(); }

  function parseAddSub() {
    let left = parseMulDiv();
    while (peek() && (peek().value === '+' || peek().value === '-')) {
      const op = next().value;
      const right = parseMulDiv();
      if (op === '+' && right && right.__isPct) left = left + left * right.value / 100;
      else if (op === '-' && right && right.__isPct) left = left - left * right.value / 100;
      else if (op === '+') left = left + right;
      else left = left - right;
    }
    return left;
  }

  function parseMulDiv() {
    let left = parseUnary();
    while (peek() && (peek().value === '*' || peek().value === '/' || peek().value === '%')) {
      const op = next().value;
      const right = parseUnary();
      if (op === '*') {
        if (right && right.__isPct) left = left * right.value / 100;
        else left = left * right;
      } else if (op === '/') {
        const d = (right && right.__isPct) ? right.value / 100 : right;
        if (d === 0) throw new Error('На ноль делить нельзя');
        left = left / d;
      } else {
        const d = (right && right.__isPct) ? right.value / 100 : right;
        if (d === 0) throw new Error('На ноль делить нельзя');
        left = left % d;
      }
    }
    return left;
  }

  function parseUnary() {
    if (peek() && peek().value === '-') { next(); return -parseUnary(); }
    if (peek() && peek().value === '+') { next(); return parseUnary(); }
    return parsePower();
  }

  function parsePower() {
    const base = parseAtom();
    if (peek() && peek().value === '^') {
      next();
      const exp = parseUnary();
      return Math.pow(base, exp);
    }
    return base;
  }

  function parseAtom() {
    const t = next();
    if (!t) throw new Error('Неожиданный конец');

    if (t.type === 'num') {
      if (peek() && peek().value === '%') { next(); return { __isPct: true, value: t.value }; }
      return t.value;
    }

    if (t.type === 'name') {
      if (t.value in CONSTS) {
        let v = CONSTS[t.value];
        if (peek() && peek().value === '%') { next(); return { __isPct: true, value: v }; }
        return v;
      }
      if (t.value in FUNCS) {
        expect('(');
        let arg = parseExpr();
        expect(')');
        if (arg && arg.__isPct) arg = arg.value;
        const fn = FUNCS[t.value];
        if (degreesMode && ['sin','cos','tan'].includes(t.value)) arg = arg * Math.PI / 180;
        let res = fn(arg);
        if (degreesMode && ['asin','acos','atan'].includes(t.value)) res = res * 180 / Math.PI;
        if (peek() && peek().value === '%') { next(); return { __isPct: true, value: res }; }
        return res;
      }
      throw new Error('Неизвестное имя: ' + t.value);
    }

    if (t.value === '(') {
      const val = parseExpr();
      expect(')');
      if (peek() && peek().value === '%') { next(); return { __isPct: true, value: val }; }
      return val;
    }
    throw new Error('Неожиданный токен: ' + t.value);
  }

  const result = parseExpr();
  if (pos < tokens.length) throw new Error('Лишний токен: ' + tokens[pos].value);
  if (result && result.__isPct) return result.value / 100;
  return result;
}

FUNCS.factorial = (n) => {
  if (n < 0 || !Number.isInteger(n)) throw new Error('Факториал только для целых ≥ 0');
  if (n > 170) throw new Error('Слишком большое число');
  let r = 1;
  for (let i = 2; i <= n; i++) r *= i;
  return r;
};

function safeEval(expr) {
  const cleaned = preprocess(expr);
  const tokens = tokenize(cleaned);
  return parse(tokens);
}

function fmt(v) {
  if (typeof v === 'number') {
    if (Number.isInteger(v) && Math.abs(v) < 1e16) return String(v);
    return String(parseFloat(v.toPrecision(12)));
  }
  return String(v);
}

// ═══════════════════════════════════════════════════════
//  ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК
// ═══════════════════════════════════════════════════════
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
  });
});

// ═══════════════════════════════════════════════════════
//  ОБЫЧНЫЙ КАЛЬКУЛЯТОР
// ═══════════════════════════════════════════════════════
let expression = '';
let resultShown = false;
let memory = 0;
let history = [];

const screenEl = document.getElementById('screen');
const hintEl   = document.getElementById('hint');
const memEl    = document.getElementById('memLabel');
const modeEl   = document.getElementById('modeBtn');
const gridEl   = document.getElementById('grid');

function updateScreen() { screenEl.textContent = expression || '0'; }

function insert(text) {
  if (resultShown) {
    if (/^[0-9.(a-zA-Z√∛π]/.test(text)) expression = '';
    resultShown = false;
  }
  if (expression.length + text.length > 120) return;
  expression += text;
  updateScreen();
}

function onClear() { expression = ''; resultShown = false; hintEl.textContent = ''; updateScreen(); }
function onBackspace() { expression = expression.slice(0, -1); resultShown = false; updateScreen(); }
function onNegate() {
  if (!expression) expression = '-';
  else if (expression.startsWith('-')) expression = expression.slice(1);
  else expression = '-' + expression;
  updateScreen();
}
function onFactorial() {
  if (resultShown) resultShown = false;
  expression = expression ? `fact(${expression})` : 'fact(';
  updateScreen();
}
function onInverse() {
  if (!expression) return;
  resultShown = false;
  expression = `1/(${expression})`;
  updateScreen();
}

function onEquals() {
  if (!expression) return;
  try {
    const open = (expression.match(/\(/g) || []).length;
    const close = (expression.match(/\)/g) || []).length;
    let expr = expression + ')'.repeat(Math.max(0, open - close));
    expr = expr.replace(/fact\(/g, 'factorial(');
    const result = safeEval(expr);
    if (typeof result !== 'number' || Number.isNaN(result) || !Number.isFinite(result)) {
      throw new Error('Результат не определён');
    }
    hintEl.textContent = expression + ' =';
    history.push([expression, fmt(result)]);
    expression = fmt(result);
    resultShown = true;
    updateScreen();
  } catch (e) {
    hintEl.textContent = '⚠ ' + e.message;
    expression = '';
    resultShown = false;
    updateScreen();
  }
}

function toggleDegrees() {
  degreesMode = !degreesMode;
  modeEl.textContent = degreesMode ? 'DEG' : 'RAD';
}

function memUpdate() { memEl.textContent = memory ? 'M: ' + fmt(memory) : ''; }
function memClear()  { memory = 0; memUpdate(); }
function memRecall() { if (resultShown) resultShown = false; expression += fmt(memory); updateScreen(); }
function memAdd()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory += v; memUpdate(); } catch(e){} }
function memSub()    { try { const v = expression ? safeEval(preprocess(expression)) : 0; memory -= v; memUpdate(); } catch(e){} }

function showHistory() {
  const hl = document.getElementById('historyList');
  hl.innerHTML = history.length
    ? history.map(([e, r]) => `<div>${e} = ${r}</div>`).join('')
    : '<div class="empty">История пуста</div>';
  document.getElementById('historyModal').classList.add('open');
}

const BUTTONS = [
  ['MC',  'gray', memClear],
  ['MR',  'gray', memRecall],
  ['M+',  'gray', memAdd],
  ['M-',  'gray', memSub],
  ['C',   'red',  onClear],

  ['sin', 'fn', () => insert('sin(')],
  ['cos', 'fn', () => insert('cos(')],
  ['tan', 'fn', () => insert('tan(')],
  ['⌫',   'ctrl', onBackspace],
  ['(',   'ctrl', () => insert('(')],

  ['√',   'fn', () => insert('√')],
  ['∛',   'fn', () => insert('∛')],
  ['x²',  'fn', () => insert('^2')],
  ['xʸ',  'fn', () => insert('^')],
  ['%',   'fn', () => insert('%')],

  ['log', 'fn', () => insert('log10(')],
  ['ln',  'fn', () => insert('log(')],
  ['n!',  'fn', onFactorial],
  ['π',   'fn', () => insert('π')],

//  ДРОБИ
// ═══════════════════════════════════════════════════════
let fA = { n: 0, d: 1 };  // первая дробь
let fB = null;            // вторая (если введена)
let fOp = null;           // операция
let fCurrent = 'A';       // куда вводим

function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a || 1; }
function simplify(f) {
  if (f.d === 0) return { n: 0, d: 0 };
  const s = f.n * f.d < 0 ? -1 : 1;
  const g = gcd(Math.abs(f.n), Math.abs(f.d));
  return { n: s * Math.abs(f.n) / g, d: Math.abs(f.d) / g };
}
function fracAdd(a, b) { return simplify({ n: a.n * b.d + b.n * a.d, d: a.d * b.d }); }
function fracSub(a, b) { return simplify({ n: a.n * b.d - b.n * a.d, d: a.d * b.d }); }
function fracMul(a, b) { return simplify({ n: a.n * b.n, d: a.d * b.d }); }
function fracDiv(a, b) { return simplify({ n: a.n * b.d, d: a.d * b.n }); }

function renderFrac() {
  const f = fCurrent === 'A' ? fA : (fB || fA);
  document.getElementById('fNum').textContent = f.n;
  document.getElementById('fDen').textContent = f.d;
}

function fracResult() {
  if (!fB || !fOp) { document.getElementById('fracResult').textContent = ''; return; }
  let r;
  if (fOp === '+') r = fracAdd(fA, fB);
  else if (fOp === '-') r = fracSub(fA, fB);
  else if (fOp === '*') r = fracMul(fA, fB);
  else if (fOp === '/') r = fracDiv(fA, fB);
  const dec = r.d !== 0 ? (r.n / r.d).toFixed(6).replace(/\.?0+$/, '') : '∞';
  document.getElementById('fracResult').textContent = `= ${r.n}/${r.d}  ≈ ${dec}`;
  document.getElementById('fNum').textContent = r.n;
  document.getElementById('fDen').textContent = r.d;
}

function fracInput(ch) {
  const f = fCurrent === 'A' ? fA : (fB = fB || { n: 0, d: 1 });
  if (ch === 'C') { f.n = 0; f.d = 1; fA = { n: 0, d: 1 }; fB = null; fOp = null; fCurrent = 'A';
                    document.getElementById('fracResult').textContent = ''; }
  else if (ch === '±') { f.n = -f.n; }
  else if (ch === 'swap') { [f.n, f.d] = [f.d, f.n]; }
  else if (ch === '.') { /* не используется */ }
  else if (/^[0-9]$/.test(ch)) {
    if (fCurrent === 'A') {
      f.n = f.n * 10 + parseInt(ch);
    } else {
      f.d = f.d * 10 + parseInt(ch);
    }
  }
  else if (['+','-','*','/'].includes(ch)) {
    if (fB && fOp) { // уже было вычисление — свернём
      const r = fOp === '+' ? fracAdd(fA, fB) : fOp === '-' ? fracSub(fA, fB)
              : fOp === '*' ? fracMul(fA, fB) : fracDiv(fA, fB);
      fA = r; fB = null;
    }
    fOp = ch;
    fB = { n: 0, d: 1 };
    fCurrent = 'B';
  }
  else if (ch === '=') {
    if (fB && fOp) fracResult();
  }
  else if (ch === 'switch') {
    fCurrent = fCurrent === 'A' ? 'B' : 'A';
    if (fCurrent === 'B' && !fB) fB = { n: 0, d: 1 };
  }
  renderFrac();
}

//  МАТРИЦЫ
// ═══════════════════════════════════════════════════════
let matrixA = null;   // { rows, cols, data: [[...]] }
let matrixB = null;
let matrixResult = null;

function renderMatrix() {
  const view = document.getElementById('matrixView');
  const showM = (m, name) => {
    if (!m) return `${name}: не задана\n`;
    return `${name} (${m.rows}×${m.cols}):\n` +
      m.data.map(row => '  [ ' + row.map(v => fmt(v).padStart(8)).join('  ') + ' ]').join('\n') + '\n';
  };
  let s = '';
  if (matrixResult) s += showM(matrixResult, 'Результат');
  s += showM(matrixA, 'A');
  if (matrixB) s += showM(matrixB, 'B');
  view.textContent = s || 'Матрица не задана. Нажмите «Создать».';
}

function matrixAdd(a, b) {
  if (a.rows !== b.rows || a.cols !== b.cols) throw new Error('Размеры не совпадают');
  return { rows: a.rows, cols: a.cols,
    data: a.data.map((r, i) => r.map((v, j) => v + b.data[i][j])) };
}
function matrixSub(a, b) {
  if (a.rows !== b.rows || a.cols !== b.cols) throw new Error('Размеры не совпадают');
  return { rows: a.rows, cols: a.cols,
    data: a.data.map((r, i) => r.map((v, j) => v - b.data[i][j])) };
}
function matrixMul(a, b) {
  if (a.cols !== b.rows) throw new Error('Несовместимые размеры');
  const r = Array.from({length: a.rows}, () => Array(b.cols).fill(0));
  for (let i = 0; i < a.rows; i++)
    for (let j = 0; j < b.cols; j++)
      for (let k = 0; k < a.cols; k++)
        r[i][j] += a.data[i][k] * b.data[k][j];
  return { rows: a.rows, cols: b.cols, data: r };
}
function matrixTranspose(a) {
  return { rows: a.cols, cols: a.rows,
    data: Array.from({length: a.cols}, (_, i) => a.data.map(r => r[i])) };
}
function matrixDeterminant(a) {
  if (a.rows !== a.cols) throw new Error('Определитель только для квадратной');
  const n = a.rows;
  const m = a.data.map(r => [...r]);
  let det = 1;
  for (let i = 0; i < n; i++) {
    let pivot = i;
    for (let j = i + 1; j < n; j++) if (Math.abs(m[j][i]) > Math.abs(m[pivot][i])) pivot = j;
    if (Math.abs(m[pivot][i]) < 1e-12) return 0;
    if (pivot !== i) { [m[i], m[pivot]] = [m[pivot], m[i]]; det = -det; }
    det *= m[i][i];
    for (let j = i + 1; j < n; j++) {
      const f = m[j][i] / m[i][i];
      for (let k = i; k < n; k++) m[j][k] -= f * m[i][k];
    }
  }
  return det;
}
function matrixTrace(a) {
  if (a.rows !== a.cols) throw new Error('След только для квадратной');
  let s = 0;
  for (let i = 0; i < a.rows; i++) s += a.data[i][i];
  return s;
}
function matrixScale(a, k) {
  return { rows: a.rows, cols: a.cols, data: a.data.map(r => r.map(v => v * k)) };
}
function matrixIdentity(n) {
  return { rows: n, cols: n, data: Array.from({length: n}, (_, i) => Array.from({length: n}, (_, j) => i === j ? 1 : 0)) };
}

// ─── Модалка создания матрицы ────────────────────────────
const matrixModal = document.getElementById('matrixModal');

function buildMatrixInputs() {
  const r = Math.max(1, Math.min(6, parseInt(mRowsEl.value) || 2));

  matrixInputsEl.style.gridTemplateColumns = `repeat(${c}, 1fr)`;
  matrixInputsEl.innerHTML = '';
  for (let i = 0; i < r; i++)

      const inp = document.createElement('input');
      inp.type = 'number'; inp.value = '0'; inp.dataset.i = i; inp.dataset.j = j;
      matrixInputsEl.appendChild(inp);
    }
}

}));

//  КОНВЕРТЕР ЕДИНИЦ
// ═══════════════════════════════════════════════════════
const CONVERSIONS = {
  'град→рад': x => x * Math.PI / 180,
  'рад→град': x => x * 180 / Math.PI,
  '°C→°F':   x => x * 9/5 + 32,
  '°F→°C':   x => (x - 32) * 5/9,
  'км→мили': x => x * 0.621371,
  'мили→км': x => x * 1.60934,
  'кг→фунт': x => x * 2.20462,
  'фунт→кг': x => x * 0.453592,
  'м→фут':   x => x * 3.28084,
  'фут→м':   x => x * 0.3048,
  'см→дюйм': x => x * 0.393701,
  'дюйм→см': x => x * 2.54,
};

let convValue = '0';
let convFrom = '°C';
let convTo   = '°F';

function renderConv() {
  document.getElementById('convScreen').textContent = convValue || '0';
  document.getElementById('convHint').textContent = `${convFrom} → ${convTo}`;
}

const CONV_BUTTONS = [
  ['7', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '7'; renderConv(); }],
  ['8', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '8'; renderConv(); }],
  ['9', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '9'; renderConv(); }],
  ['.', 'num', () => { if (!convValue.includes('.')) { convValue = (convValue || '0') + '.'; renderConv(); } }],
  ['C', 'red', () => { convValue = '0'; renderConv(); }],

  ['4', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '4'; renderConv(); }],
  ['5', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '5'; renderConv(); }],
  ['6', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '6'; renderConv(); }],
  ['±', 'ctrl',() => { if (convValue.startsWith('-')) convValue = convValue.slice(1); else convValue = '-' + convValue; renderConv(); }],
  ['⌫', 'ctrl',() => { convValue = convValue.slice(0, -1) || '0'; renderConv(); }],

  ['1', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '1'; renderConv(); }],
  ['2', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '2'; renderConv(); }],
  ['3', 'num', () => { convValue = (convValue === '0' ? '' : convValue) + '3'; renderConv(); }],

  ['=', 'green', () => {
    try {
      const key = convFrom + '→' + convTo;
      if (!(key in CONVERSIONS)) throw new Error('Неизвестная пара');
      const v = parseFloat(convValue) || 0;
      const r = CONVERSIONS[key](v);
      document.getElementById('convHint').textContent = `${v} ${convFrom} = ${fmt(r)} ${convTo}`;
    } catch(e) {
      document.getElementById('convHint').textContent = '⚠ ' + e.message;
    }
  }],

  ['°C→°F', 'blue', () => { convFrom = '°C'; convTo = '°F'; renderConv(); }],
  ['°F→°C', 'blue', () => { convFrom = '°F'; convTo = '°C'; renderConv(); }],
  ['град→рад', 'fn', () => { convFrom = 'град'; convTo = 'рад'; renderConv(); }],
  ['рад→град', 'fn', () => { convFrom = 'рад'; convTo = 'град'; renderConv(); }],
  ['км→мили', 'teal', () => { convFrom = 'км'; convTo = 'мили'; renderConv(); }],
  ['мили→км', 'teal', () => { convFrom = 'мили'; convTo = 'км'; renderConv(); }],
  ['кг→фунт', 'teal', () => { convFrom = 'кг'; convTo = 'фунт'; renderConv(); }],
  ['фунт→кг', 'teal', () => { convFrom = 'фунт'; convTo = 'кг'; renderConv(); }],
  ['м→фут', 'gray', () => { convFrom = 'м'; convTo = 'фут'; renderConv(); }],
  ['фут→м', 'gray', () => { convFrom = 'фут'; convTo = 'м'; renderConv(); }],
];
